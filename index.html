<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✦ Nexus · Elite Dashboard</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent-primary: #fbbf24; /* Amber 400 */
            --accent-secondary: #f59e0b; /* Amber 500 */
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --border-color: rgba(251, 191, 36, 0.1);
            --glass-border: rgba(255, 255, 255, 0.05);
            --glow-color: rgba(251, 191, 36, 0.15);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(251, 191, 36, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, 0.05) 0%, transparent 50%);
        }

        /* --- BACKGROUND ANIMATION --- */
        .bg-mesh {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.4;
            filter: blur(100px);
        }
        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: move 25s infinite alternate;
        }
        .blob-2 {
            background: #4f46e5;
            right: 0;
            bottom: 0;
            animation-delay: -5s;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%) rotate(0deg); }
            to { transform: translate(20%, 20%) rotate(360deg); }
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1200px;
            width: 90%;
            margin: 4rem auto;
            position: relative;
            z-index: 1;
        }

        /* --- HEADER --- */
        header {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .logo-area {
            display: inline-flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .logo-icon {
            font-size: 2.5rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 15px var(--glow-color));
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -1px;
            background: linear-gradient(to bottom, #fff, #9ca3af);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .badge-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }

        .status-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }

        .status-badge:hover {
            border-color: var(--accent-primary);
            color: var(--text-main);
        }

        .status-badge i {
            color: var(--accent-primary);
        }

        /* --- SEARCH --- */
        .search-section {
            max-width: 600px;
            margin: 0 auto 4rem;
            position: relative;
            animation: fadeInUp 1s ease-out;
        }

        .search-box {
            position: relative;
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 0.5rem;
            display: flex;
            align-items: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px var(--glow-color);
            transform: translateY(-2px);
        }

        .search-box i.fa-search {
            margin-left: 1.5rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        #searchInput {
            width: 100%;
            background: transparent;
            border: none;
            padding: 1rem;
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            font-family: inherit;
        }

        .search-k {
            background: rgba(255, 255, 255, 0.05);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-right: 1rem;
            border: 1px solid var(--glass-border);
        }

        .search-clear {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.5rem;
            margin-right: 0.5rem;
            opacity: 0;
            transition: var(--transition);
        }

        .search-clear.visible { opacity: 1; }
        .search-clear:hover { color: var(--accent-primary); }

        /* --- GRID --- */
        .routes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .routes-grid.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- CARD --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
            backdrop-filter: blur(10px);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at top right, rgba(251, 191, 36, 0.1), transparent 70%);
            opacity: 0;
            transition: var(--transition);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(251, 191, 36, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            background: rgba(17, 24, 39, 0.9);
        }

        .card:hover::before { opacity: 1; }

        .card-icon-box {
            width: 60px;
            height: 60px;
            background: rgba(251, 191, 36, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            color: var(--accent-primary);
            transition: var(--transition);
        }

        .card:hover .card-icon-box {
            background: var(--accent-primary);
            color: var(--bg-color);
            transform: scale(1.1) rotate(5deg);
        }

        .card h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
            color: #fff;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .file-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .visit-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            transition: var(--transition);
        }

        .card:hover .visit-btn {
            background: var(--accent-primary);
            color: var(--bg-color);
            transform: translateX(5px);
        }

        /* --- UTILS --- */
        .loading {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
        }

        .loading i {
            font-size: 2rem;
            margin-bottom: 1rem;
            display: block;
            color: var(--accent-primary);
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { margin: 2rem auto; }
        }
    </style>
</head>
<body>

    <div class="bg-mesh">
        <div class="blob"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="container">
        <header>
            <div class="logo-area">
                <i class="fas fa-compass logo-icon"></i>
            </div>
            <h1>Nexus Rout</h1>
            <div class="badge-row">
                <div class="status-badge">
                    <i class="fas fa-code-branch"></i>
                    <span>main</span>
                </div>
                <div class="status-badge" id="routeCounter">
                    <i class="fas fa-layer-group"></i>
                    <span id="countNumber">0</span> Routes
                </div>
                <div class="status-badge">
                    <i class="fas fa-shield-halved"></i>
                    <span>Secure</span>
                </div>
            </div>
        </header>

        <section class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search routes or tools..." autocomplete="off">
                <span class="search-k">Ctrl + K</span>
                <button class="search-clear" id="searchClear">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </section>

        <main class="routes-grid" id="routesGrid">
            <div class="loading">
                <i class="fas fa-circle-notch fa-spin"></i>
                <p>Initializing connection to Nexus repository...</p>
            </div>
        </main>
    </div>

    <script>
        const GITHUB_USER = "vostruskovo";
        const GITHUB_REPO = "rtmp";
        const BRANCH = "main";

        const grid = document.getElementById('routesGrid');
        const countNumber = document.getElementById('countNumber');
        const searchInput = document.getElementById('searchInput');
        const searchClear = document.getElementById('searchClear');

        let allFiles = [];

        // --- ICON LOGIC ---
        function getMetadata(name) {
            const n = name.toLowerCase();
            if (n.includes('map') || n.includes('route') || n.includes('gps')) 
                return { icon: 'fa-map-location-dot', desc: 'Advanced spatial navigation and real-time mapping systems.' };
            if (n.includes('med') || n.includes('health') || n.includes('doctor')) 
                return { icon: 'fa-heart-pulse', desc: 'Comprehensive healthcare management and patient data analytics.' };
            if (n.includes('appoint') || n.includes('calendar') || n.includes('schedule')) 
                return { icon: 'fa-calendar-day', desc: 'Precision scheduling and enterprise appointment orchestration.' };
            if (n.includes('car') || n.includes('auto') || n.includes('vehicle')) 
                return { icon: 'fa-car-side', desc: 'Fleet monitoring and automotive logistics management.' };
            if (n.includes('chat') || n.includes('message') || n.includes('talk')) 
                return { icon: 'fa-comment-dots', desc: 'Real-time encrypted communication and collaborative messaging.' };
            if (n.includes('video') || n.includes('stream') || n.includes('play')) 
                return { icon: 'fa-play-circle', desc: 'High-performance media streaming and video content delivery.' };
            if (n.includes('shop') || n.includes('store') || n.includes('cart')) 
                return { icon: 'fa-shopping-bag', desc: 'Next-gen e-commerce platform with integrated payment flows.' };
            if (n.includes('game') || n.includes('play') || n.includes('fun')) 
                return { icon: 'fa-gamepad', desc: 'Interactive entertainment and cloud-based gaming modules.' };
            
            return { icon: 'fa-bolt', desc: 'A high-performance utility module integrated into the Nexus ecosystem.' };
        }

        async function fetchFiles() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents?ref=${BRANCH}`);
                const data = await res.json();
                
                allFiles = data
                    .filter(f => f.type === 'file' && f.name.endsWith('.html') && f.name.toLowerCase() !== 'index.html')
                    .map(f => f.name);
                
                renderFiles(allFiles);
                countNumber.textContent = allFiles.length;
                grid.classList.add('loaded');
            } catch (err) {
                grid.innerHTML = `<div class="loading"><i class="fas fa-exclamation-triangle"></i><p>Failed to connect to repository. Please try again later.</p></div>`;
            }
        }

        function renderFiles(files) {
            if (files.length === 0) {
                grid.innerHTML = `<div class="loading"><i class="fas fa-search"></i><p>No routes found matching your criteria.</p></div>`;
                return;
            }

            grid.innerHTML = files.map(file => {
                const base = file.replace('.html', '');
                const meta = getMetadata(base);
                const title = base.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                
                return `
                    <div class="card" onclick="window.location.href='${file}'">
                        <div class="card-icon-box">
                            <i class="fas ${meta.icon}"></i>
                        </div>
                        <h2>${title}</h2>
                        <p>${meta.desc}</p>
                        <div class="card-footer">
                            <span class="file-name">${file}</span>
                            <div class="visit-btn">
                                <i class="fas fa-arrow-right"></i>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- SEARCH & HOTKEYS ---
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allFiles.filter(f => f.toLowerCase().includes(term));
            renderFiles(filtered);
            searchClear.classList.toggle('visible', term.length > 0);
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            renderFiles(allFiles);
            searchClear.classList.remove('visible');
            searchInput.focus();
        });

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        fetchFiles();
    </script>
</body>
</html>
