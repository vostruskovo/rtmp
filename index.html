<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✦ My Routes · Nexus</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 30%, #0b1a33, #0a0f1f);
      padding: 1.5rem;
    }

    /* glass-morphism container */
    .dashboard {
      max-width: 900px;
      width: 100%;
      background: rgba(12, 25, 45, 0.55);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 3.5rem;
      padding: 2.8rem 2.5rem;
      box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.15);
      border: 1px solid rgba(255, 215, 0, 0.08);
      transition: all 0.3s ease;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #f6e9a0, #f0c27f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.2rem;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .subhead {
      text-align: center;
      font-weight: 300;
      letter-spacing: 2px;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.5);
      border-bottom: 1px dashed rgba(255, 215, 0, 0.2);
      padding-bottom: 1.8rem;
      margin-bottom: 2.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .subhead i {
      color: #f0c27f;
      font-size: 1.1rem;
    }

    .routes {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    /* card — futuristic glow */
    .card {
      background: rgba(20, 40, 70, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border-radius: 2.2rem;
      padding: 1.8rem 1.2rem 1.8rem 1.2rem;
      width: 200px;
      text-align: center;
      box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.1);
      transition: all 0.25s cubic-bezier(0.23, 1, 0.32, 1);
      border: 1px solid rgba(255, 215, 0, 0.08);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255, 215, 0, 0.03), transparent, rgba(255, 215, 0, 0.06), transparent);
      animation: rotateGlow 12s linear infinite;
      opacity: 0.3;
      pointer-events: none;
    }

    @keyframes rotateGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      background: rgba(30, 55, 95, 0.7);
      border-color: #ffd700;
      box-shadow: 0 25px 40px -10px #000000cc, 0 0 30px rgba(255, 215, 0, 0.2);
    }

    .card-icon {
      font-size: 2.8rem;
      color: #ffd700;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
      margin-bottom: 0.4rem;
    }

    .card h2 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0.2rem 0 0.2rem 0;
      color: #fff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
      word-break: break-word;
    }

    .card .badge {
      display: inline-block;
      background: rgba(255, 215, 0, 0.15);
      color: #ffd700;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 215, 0, 0.2);
      margin: 0.2rem 0 0.8rem 0;
      backdrop-filter: blur(2px);
    }

    .card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.4rem;
      padding: 0.6rem 1.6rem;
      background: linear-gradient(145deg, #ffd700, #f0b800);
      color: #0b1a2e;
      text-decoration: none;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(2px);
    }

    .card a i {
      font-size: 0.9rem;
      transition: transform 0.2s ease;
    }

    .card a:hover {
      background: linear-gradient(145deg, #ffe066, #f5c400);
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(255, 215, 0, 0.5);
      color: #000;
    }

    .card a:hover i {
      transform: translateX(4px);
    }

    /* 404 fallback alert – subtle inline */
    .toast-404 {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 10, 20, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 1rem 2.2rem;
      border-radius: 60px;
      border: 1px solid rgba(255, 80, 80, 0.3);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      color: #ffb3b3;
      font-weight: 500;
      letter-spacing: 0.3px;
      display: none;
      align-items: center;
      gap: 1rem;
      z-index: 999;
      pointer-events: none;
      font-size: 0.95rem;
    }

    .toast-404 i {
      color: #ff6b6b;
      font-size: 1.4rem;
    }

    /* small screen */
    @media (max-width: 600px) {
      .dashboard { padding: 1.8rem 1rem; border-radius: 2.5rem; }
      h1 { font-size: 2.2rem; }
      .card { width: 160px; padding: 1.2rem 0.8rem; }
      .card h2 { font-size: 1.2rem; }
      .card a { padding: 0.5rem 1.2rem; font-size: 0.8rem; }
    }

    /* extra glow for header */
    .glow-text {
      text-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
    }

    /* sanitized output – no XSS */
    .safe-badge {
      display: inline-block;
      background: rgba(0, 255, 200, 0.08);
      border-radius: 40px;
      padding: 0.1rem 0.9rem;
      color: rgba(255, 255, 255, 0.3);
      font-size: 0.7rem;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }
  </style>
</head>
<body>

<div class="dashboard">
  <h1>
    <i class="fas fa-compass" style="font-size: 2.2rem; color: #f0c27f; filter: drop-shadow(0 0 10px #ffd70055);"></i>
    My Routes
  </h1>
  <div class="subhead">
    <i class="fas fa-route"></i>
    <span>nexus · 2026</span>
    <i class="fas fa-bolt" style="color: #ffd700;"></i>
    <span class="safe-badge"><i class="fas fa-shield-alt"></i> sanitized</span>
  </div>

  <div class="routes" id="routes"></div>
</div>

<!-- hidden 404 toast (will be shown via JS) -->
<div id="toast404" class="toast-404">
  <i class="fas fa-exclamation-triangle"></i>
  <span id="toastMessage">NOT FOUND 404 · redirecting to main route</span>
</div>

<script>
  (function() {
    // ----- SECURE & STYLISH ROUTE DASHBOARD -----
    // tools list (sanitized)
    const tools = ["routMap", "appointment"];
    const ext = ".html";

    // ---------- SANITIZATION HELPERS (XSS protection) ----------
    function escapeHtml(unsafe) {
      if (!unsafe) return '';
      return unsafe
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // capitalise first letter (safe)
    function capitalise(str) {
      if (!str || typeof str !== 'string') return '';
      return str.charAt(0).toUpperCase() + str.slice(1).toLowerCase();
    }

    // ----- 404 TOAST (non‑blocking, elegant) -----
    const toast = document.getElementById('toast404');
    const toastMsg = document.getElementById('toastMessage');

    function show404(fileName) {
      const safeName = escapeHtml(fileName) || 'file';
      toastMsg.innerHTML = `❌ NOT FOUND 404 · <strong>${safeName}</strong> · redirecting to main route`;
      toast.style.display = 'flex';
      // auto‑hide after 3.2s
      setTimeout(() => {
        toast.style.display = 'none';
      }, 3200);
    }

    // ----- RENDER CARDS -----
    const container = document.getElementById('routes');
    if (!container) return;

    // clear potential garbage (just in case)
    container.innerHTML = '';

    tools.forEach((tool, index) => {
      // sanitize tool name (prevent any XSS)
      const safeTool = escapeHtml(tool);
      // if tool is empty skip
      if (!safeTool) return;

      // card
      const card = document.createElement('div');
      card.className = 'card';

      // ----- icon (based on tool) -----
      const iconElem = document.createElement('div');
      iconElem.className = 'card-icon';
      // choose icon: map or calendar
      let iconClass = 'fa-map-location-dot';
      if (safeTool.toLowerCase().includes('appoint')) {
        iconClass = 'fa-calendar-check';
      } else if (safeTool.toLowerCase().includes('map')) {
        iconClass = 'fa-map-location-dot';
      } else {
        iconClass = 'fa-link';
      }
      iconElem.innerHTML = `<i class="fas ${iconClass}"></i>`;

      // title (sanitized)
      const title = document.createElement('h2');
      // capitalise safely, then escape again (double‑safe)
      const displayName = capitalise(safeTool);
      title.textContent = displayName; // textContent = no XSS

      // badge (extra flavour)
      const badge = document.createElement('div');
      badge.className = 'badge';
      // add a small emoji / indicator
      badge.textContent = '⚡ active';

      // link (anchor) – we will override click to check file
      const link = document.createElement('a');
      link.href = '#';
      link.setAttribute('role', 'button');
      link.setAttribute('aria-label', `Open ${displayName}`);

      // link content (safe)
      const linkText = document.createTextNode(`Open ${displayName}`);
      const iconLink = document.createElement('i');
      iconLink.className = 'fas fa-arrow-right';

      link.appendChild(linkText);
      link.appendChild(iconLink);

      // assemble card
      card.appendChild(iconElem);
      card.appendChild(title);
      card.appendChild(badge);
      card.appendChild(link);

      // ----- CLICK HANDLER with file existence check (HEAD) + XSS safe -----
      link.addEventListener('click', function(e) {
        e.preventDefault();

        // construct file name safely
        const fileName = safeTool + ext;   // safeTool already escaped, but ext is hardcoded safe
        // but we need to check the actual file: we use the original tool name (unsanitized but from trusted array)
        // we use the original tool variable (which is from the array, safe)
        const originalTool = tool; // from array, no user input
        const fileToFetch = originalTool + ext; 

        // fetch HEAD to check existence
        fetch(fileToFetch, { method: 'HEAD' })
          .then(response => {
            if (response.ok) {
              // file exists → navigate
              window.location.href = fileToFetch;
            } else {
              // 404
              show404(originalTool + ext);
              // redirect to index.html after short delay
              setTimeout(() => {
                window.location.href = 'index.html';
              }, 600);
            }
          })
          .catch(() => {
            // network error or other → treat as 404
            show404(originalTool + ext);
            setTimeout(() => {
              window.location.href = 'index.html';
            }, 600);
          });
      });

      container.appendChild(card);
    });

    // ----- extra: if no tools, show fallback (but we have 2) -----
    if (tools.length === 0) {
      const emptyMsg = document.createElement('p');
      emptyMsg.style.color = 'rgba(255,255,255,0.4)';
      emptyMsg.textContent = '✨ no routes configured';
      container.appendChild(emptyMsg);
    }

    // ----- global safeguard: override any dangerous injection (already safe) -----
    // Also ensure that any tool from array cannot contain <script> etc.
    // we already escaped via escapeHtml.
    console.log('🚀 Routes ready · secure & stylish');
  })();
</script>
</body>
</html>
