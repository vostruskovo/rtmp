<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 Advanced Regex Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Poppins', system-ui, -apple-system, sans-serif;
      background: #0b0e11;
      color: #e3e6ea;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app-container {
      max-width: 1600px;
      width: 100%;
      background: #14181c;
      border-radius: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      padding: 28px 30px 32px;
      border: 1px solid #2e3a42;
    }

    h1 {
      font-weight: 600;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #c8e6e0;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 span {
      background: #1f2c33;
      padding: 4px 16px;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 400;
      color: #8aa9b5;
    }

    .controls-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 18px;
      background: #1e262c;
      padding: 18px 24px;
      border-radius: 60px;
      margin-bottom: 28px;
      border: 1px solid #2f3d45;
    }

    .file-zone {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .file-zone label {
      background: #2a3840;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #b6d0d9;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #3d515b;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .file-zone label:hover {
      background: #31444e;
      border-color: #5b7c8a;
    }
    .file-zone input[type="file"] { display: none; }
    .file-name {
      font-size: 0.85rem;
      color: #95b3bf;
      background: #10171c;
      padding: 4px 14px;
      border-radius: 30px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid #2d3e47;
    }

    .regex-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 2 1 400px;
      flex-wrap: wrap;
    }
    .regex-group .field {
      background: #10171c;
      border: 1px solid #2f4049;
      border-radius: 40px;
      padding: 10px 18px;
      color: #eef4f7;
      font-size: 0.9rem;
      font-family: 'Fira Code', monospace;
      flex: 1 0 120px;
      min-width: 100px;
      transition: 0.2s;
    }
    .regex-group .field:focus {
      outline: none;
      border-color: #54b7a6;
      box-shadow: 0 0 0 3px rgba(84,183,166,0.3);
    }
    .regex-group .field::placeholder {
      color: #5c7986;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
    }
    .regex-group .field-replace { border-color: #3f5a66; }
    .badge {
      background: #1d2e36;
      padding: 4px 12px;
      border-radius: 40px;
      color: #86b1bf;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .options-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px 24px;
      padding: 6px 0 16px 0;
      border-bottom: 1px solid #1f2e36;
      margin-bottom: 20px;
    }
    .options-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: #aac2cd;
      cursor: pointer;
      background: #1a252c;
      padding: 4px 14px 4px 10px;
      border-radius: 30px;
      border: 1px solid #2b3d46;
      transition: 0.15s;
    }
    .options-row label:hover {
      background: #23333c;
      border-color: #3f5a66;
    }
    .options-row input[type="checkbox"] {
      accent-color: #54b7a6;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .options-row .action-pill {
      background: #1d3a3f;
      border: 1px solid #2f636b;
      padding: 4px 18px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #b3e2db;
      cursor: pointer;
      transition: 0.15s;
    }
    .options-row .action-pill:hover {
      background: #26555b;
      border-color: #3d8f99;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 8px;
    }

    .preview-card {
      background: #10171c;
      border-radius: 20px;
      border: 1px solid #26343c;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: 0.2s;
    }
    .preview-card:hover { border-color: #3f5965; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #19232a;
      border-bottom: 1px solid #26333b;
      font-weight: 500;
      font-size: 0.9rem;
      color: #b2cedb;
    }
    .card-header .count {
      background: #1d2e36;
      padding: 2px 12px;
      border-radius: 40px;
      font-size: 0.7rem;
      color: #80a8b7;
    }

    .code-area {
      padding: 18px 20px;
      min-height: 380px;
      max-height: 500px;
      overflow-y: auto;
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      background: #0b1115;
      color: #d8e6ed;
    }
    .code-area::-webkit-scrollbar { width: 6px; }
    .code-area::-webkit-scrollbar-track { background: #10191f; }
    .code-area::-webkit-scrollbar-thumb { background: #2f4a56; border-radius: 8px; }
    .code-area.highlight-diff { background: #0d171e; }

    .regex-match-highlight {
      background: #f7b731;
      color: #0f1419;
      border-radius: 4px;
      padding: 1px 2px;
      box-shadow: 0 0 0 1px #d49b22;
      font-weight: 500;
    }

    .match-list-panel {
      background: #111a1f;
      border-radius: 16px;
      border: 1px solid #26343c;
      padding: 14px 18px;
      margin-top: 18px;
      max-height: 160px;
      overflow-y: auto;
    }
    .match-list-panel .match-item {
      font-family: 'Fira Code', monospace;
      font-size: 0.8rem;
      padding: 4px 8px;
      border-bottom: 1px solid #1d2c34;
      color: #c0d9e3;
      display: flex;
      gap: 12px;
    }
    .match-list-panel .match-item .idx {
      color: #5f8b9b;
      min-width: 40px;
    }
    .match-list-panel .match-item .txt {
      background: #1e2f38;
      padding: 0 8px;
      border-radius: 12px;
      color: #f0d89f;
    }
    .match-list-panel .match-item .ctx {
      color: #7f9fae;
      font-size: 0.7rem;
      opacity: 0.7;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding: 12px 8px 4px 8px;
      color: #7097a6;
      font-size: 0.8rem;
      border-top: 1px solid #1f2e36;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-bar .action-btn {
      background: transparent;
      border: 1px solid #3a555f;
      padding: 6px 22px;
      border-radius: 40px;
      color: #c8e0e9;
      font-weight: 500;
      font-size: 0.8rem;
      transition: 0.2s;
      cursor: pointer;
    }
    .status-bar .action-btn:hover {
      background: #1f343e;
      border-color: #5d8596;
      color: #f0f9ff;
    }
    .status-bar .action-btn.download {
      background: #1f4d4a;
      border-color: #2f776f;
      color: #d7f3ed;
    }
    .status-bar .action-btn.download:hover {
      background: #28635e;
      border-color: #3b9b8f;
    }
    .status-bar .match-count {
      background: #1d2e36;
      padding: 2px 16px;
      border-radius: 40px;
      font-size: 0.75rem;
      color: #b2d3d3;
    }

    @media (max-width: 800px) {
      .preview-grid { grid-template-columns: 1fr; }
      .controls-panel { flex-direction: column; align-items: stretch; border-radius: 28px; padding: 18px; }
      .regex-group { flex-direction: column; align-items: stretch; }
      .file-zone { justify-content: space-between; }
      .options-row { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <h1>
    🧠 Advanced Regex Studio
    <span>highlight · list · history</span>
  </h1>

  <div class="controls-panel">
    <div class="file-zone">
      <label for="fileInput">📂 Upload</label>
      <input type="file" id="fileInput" accept=".html,.txt,.js,.css,.json,.xml,.md,.csv,.py,.c,.cpp">
      <span class="file-name" id="fileNameDisplay">no file</span>
    </div>
    <div class="regex-group">
      <input type="text" id="findText" class="field" placeholder="Regex (e.g. \\d+)" spellcheck="false">
      <span class="badge">→</span>
      <input type="text" id="replaceText" class="field field-replace" placeholder="Replace with ..." spellcheck="false">
    </div>
  </div>

  <!-- options row -->
  <div class="options-row">
    <label><input type="checkbox" id="caseSensitive"> Aa case sensitive</label>
    <label><input type="checkbox" id="wholeWord"> 🔤 whole word</label>
    <label><input type="checkbox" id="multiLine"> 📐 multiline</label>
    <span class="action-pill" id="toggleMatchListBtn">📋 toggle match list</span>
    <span class="action-pill" id="undoBtn">↩️ undo (history)</span>
    <span class="action-pill" id="clearHistoryBtn">🧹 clear history</span>
  </div>

  <!-- preview grid -->
  <div class="preview-grid">
    <div class="preview-card">
      <div class="card-header">
        <span>📄 Original <span style="font-weight:400;font-size:0.75rem;color:#6b95a5;">(matches highlighted)</span></span>
        <span class="count" id="originalCount">0 chars</span>
      </div>
      <div class="code-area" id="originalOutput">⬆️ Upload a file</div>
    </div>
    <div class="preview-card">
      <div class="card-header">
        <span>✨ Modified</span>
        <span class="count" id="modifiedCount">0 chars</span>
      </div>
      <div class="code-area highlight-diff" id="modifiedOutput">✨ modifications appear here</div>
    </div>
  </div>

  <!-- match list (collapsible) -->
  <div id="matchListContainer" style="display: none;">
    <div class="match-list-panel" id="matchListPanel">
      <div style="font-weight:500;color:#8bb4c2;margin-bottom:8px;font-size:0.8rem;">📌 matches found</div>
      <div id="matchListItems"></div>
    </div>
  </div>

  <!-- status bar -->
  <div class="status-bar">
    <div id="statsMessage">⏳ waiting for file</div>
    <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;">
      <span class="match-count" id="matchCountDisplay">matches: 0</span>
      <span class="match-count" id="historyCountDisplay">history: 0</span>
      <button class="action-btn" id="resetBtn">↺ reset</button>
      <button class="action-btn download" id="downloadBtn">⬇ download</button>
    </div>
  </div>
</div>

<script>
  (function() {
    // DOM refs
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const findText = document.getElementById('findText');
    const replaceText = document.getElementById('replaceText');
    const originalOutput = document.getElementById('originalOutput');
    const modifiedOutput = document.getElementById('modifiedOutput');
    const originalCount = document.getElementById('originalCount');
    const modifiedCount = document.getElementById('modifiedCount');
    const statsMessage = document.getElementById('statsMessage');
    const matchCountDisplay = document.getElementById('matchCountDisplay');
    const historyCountDisplay = document.getElementById('historyCountDisplay');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const toggleMatchListBtn = document.getElementById('toggleMatchListBtn');
    const matchListContainer = document.getElementById('matchListContainer');
    const matchListItems = document.getElementById('matchListItems');
    const undoBtn = document.getElementById('undoBtn');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const caseSensitive = document.getElementById('caseSensitive');
    const wholeWord = document.getElementById('wholeWord');
    const multiLine = document.getElementById('multiLine');

    // state
    let originalContent = '';
    let currentModified = '';
    let currentFileName = '';
    let history = [];          // array of {modified, timestamp}
    let historyIndex = -1;
    let matchListVisible = false;

    // ─── helpers ──────────────────────────────────────────────

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function buildRegex(pattern) {
      let flags = 'g';
      if (caseSensitive.checked) flags += '';
      else flags += 'i';
      if (multiLine.checked) flags += 'm';
      // whole word: we wrap pattern with \b only if not already a word boundary
      let finalPattern = pattern;
      if (wholeWord.checked && pattern.trim() !== '') {
        // avoid double boundaries
        if (!pattern.startsWith('\\b') && !pattern.startsWith('^')) {
          finalPattern = '\\b' + finalPattern;
        }
        if (!pattern.endsWith('\\b') && !pattern.endsWith('$')) {
          finalPattern = finalPattern + '\\b';
        }
      }
      return new RegExp(finalPattern, flags);
    }

    function getMatchDetails(text, pattern) {
      if (!text || !pattern) return [];
      try {
        const regex = buildRegex(pattern);
        const matches = [];
        let match;
        while ((match = regex.exec(text)) !== null) {
          matches.push({
            index: match.index,
            length: match[0].length,
            text: match[0],
            context: text.substring(Math.max(0, match.index-20), Math.min(text.length, match.index+match.length+20))
          });
          if (match.index === regex.lastIndex) break; // avoid infinite loop
        }
        return matches;
      } catch (err) {
        return [];
      }
    }

    function highlightMatches(text, pattern) {
      if (!text || !pattern) return escapeHtml(text);
      try {
        const regex = buildRegex(pattern);
        // we need to preserve newlines, we use a safe approach
        const parts = [];
        let lastIndex = 0;
        let match;
        // reset
        const regexClone = buildRegex(pattern);
        while ((match = regexClone.exec(text)) !== null) {
          const start = match.index;
          const end = start + match[0].length;
          parts.push(escapeHtml(text.substring(lastIndex, start)));
          parts.push(`<span class="regex-match-highlight">${escapeHtml(match[0])}</span>`);
          lastIndex = end;
          if (start === regexClone.lastIndex) break;
        }
        parts.push(escapeHtml(text.substring(lastIndex)));
        return parts.join('');
      } catch (err) {
        return escapeHtml(text);
      }
    }

    function countMatches(text, pattern) {
      if (!text || !pattern) return 0;
      try {
        const regex = buildRegex(pattern);
        const m = text.match(regex);
        return m ? m.length : 0;
      } catch { return 0; }
    }

    function updateMatchList(text, pattern) {
      if (!matchListVisible || !text || !pattern) {
        matchListItems.innerHTML = '<div style="color:#4c6a78;font-style:italic;">no matches or list hidden</div>';
        return;
      }
      const details = getMatchDetails(text, pattern);
      if (details.length === 0) {
        matchListItems.innerHTML = '<div style="color:#4c6a78;font-style:italic;">no matches found</div>';
        return;
      }
      let html = '';
      details.forEach((d, i) => {
        html += `<div class="match-item">
          <span class="idx">#${i+1}</span>
          <span class="txt">${escapeHtml(d.text)}</span>
          <span class="ctx">…${escapeHtml(d.context)}…</span>
        </div>`;
      });
      matchListItems.innerHTML = html;
    }

    function render(original, modified, pattern) {
      if (!original) {
        originalOutput.innerHTML = '⬆️ Upload a file';
        modifiedOutput.textContent = '✨ modifications appear here';
        originalCount.textContent = '0 chars';
        modifiedCount.textContent = '0 chars';
        matchCountDisplay.textContent = 'matches: 0';
        matchListItems.innerHTML = '';
        return;
      }

      // original with highlights
      if (pattern && pattern.trim() !== '') {
        originalOutput.innerHTML = highlightMatches(original, pattern);
        const mc = countMatches(original, pattern);
        matchCountDisplay.textContent = `matches: ${mc}`;
        updateMatchList(original, pattern);
      } else {
        originalOutput.innerHTML = escapeHtml(original);
        matchCountDisplay.textContent = 'matches: 0';
        matchListItems.innerHTML = '<div style="color:#4c6a78;font-style:italic;">enter a pattern</div>';
      }

      modifiedOutput.textContent = modified || original;
      const oLen = original.length;
      const mLen = modified ? modified.length : oLen;
      originalCount.textContent = oLen + ' chars';
      modifiedCount.textContent = mLen + ' chars';
      const diff = mLen - oLen;
      statsMessage.textContent = `📊 orig ${oLen} · mod ${mLen} (${diff===0?'⚖️':diff>0?'+'+diff:diff} chars)`;
    }

    // ─── apply transformation ──────────────────────────────────

    function applyTransformation(pushHistory = true) {
      if (!originalContent) {
        currentModified = '';
        render('', '', '');
        return;
      }

      const pattern = findText.value;
      const replace = replaceText.value;

      if (!pattern || pattern.trim() === '') {
        currentModified = originalContent;
        render(originalContent, originalContent, '');
        return;
      }

      try {
        const regex = buildRegex(pattern);
        const result = originalContent.replace(regex, replace);
        if (pushHistory && result !== currentModified) {
          // push to history
          history.push({ modified: result, timestamp: Date.now() });
          if (history.length > 50) history.shift();
          historyIndex = history.length - 1;
          historyCountDisplay.textContent = `history: ${history.length}`;
        }
        currentModified = result;
        render(originalContent, currentModified, pattern);
      } catch (err) {
        currentModified = originalContent;
        render(originalContent, originalContent, '');
        statsMessage.textContent = `⚠️ invalid regex: ${err.message}`;
        matchCountDisplay.textContent = '⚠️ error';
      }
    }

    // ─── undo / history ────────────────────────────────────────

    function undoLast() {
      if (history.length === 0) return;
      if (historyIndex <= 0) {
        // revert to original
        currentModified = originalContent;
        historyIndex = -1;
      } else {
        historyIndex--;
        currentModified = history[historyIndex].modified;
      }
      render(originalContent, currentModified, findText.value);
      statsMessage.textContent = `↩️ undo to revision ${historyIndex+1}`;
    }

    function clearHistory() {
      history = [];
      historyIndex = -1;
      historyCountDisplay.textContent = 'history: 0';
      statsMessage.textContent = '🧹 history cleared';
      // re-apply to reset
      applyTransformation(false);
    }

    // ─── file load ────────────────────────────────────────────

    function loadFile(file) {
      if (!file) { resetState(); return; }
      currentFileName = file.name;
      fileNameDisplay.textContent = currentFileName;
      const reader = new FileReader();
      reader.onload = (e) => {
        originalContent = e.target.result;
        history = [];
        historyIndex = -1;
        historyCountDisplay.textContent = 'history: 0';
        applyTransformation(false);
        statsMessage.textContent = `✅ loaded ${currentFileName} (${originalContent.length} chars)`;
      };
      reader.onerror = () => { alert('Error reading file'); resetState(); };
      reader.readAsText(file);
    }

    function resetState() {
      originalContent = '';
      currentModified = '';
      currentFileName = '';
      fileNameDisplay.textContent = 'no file';
      fileInput.value = '';
      findText.value = '';
      replaceText.value = '';
      history = [];
      historyIndex = -1;
      historyCountDisplay.textContent = 'history: 0';
      render('', '', '');
      statsMessage.textContent = '⏳ waiting for file';
      matchCountDisplay.textContent = 'matches: 0';
      matchListItems.innerHTML = '';
    }

    // ─── events ────────────────────────────────────────────────

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadFile(file);
      else resetState();
    });

    findText.addEventListener('input', () => applyTransformation(true));
    replaceText.addEventListener('input', () => applyTransformation(true));

    caseSensitive.addEventListener('change', () => applyTransformation(true));
    wholeWord.addEventListener('change', () => applyTransformation(true));
    multiLine.addEventListener('change', () => applyTransformation(true));

    resetBtn.addEventListener('click', resetState);

    downloadBtn.addEventListener('click', () => {
      if (!originalContent) { alert('Upload a file first.'); return; }
      const content = currentModified || originalContent;
      const blob = new Blob([content], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      const base = currentFileName ? currentFileName.replace(/\.[^.]+$/, '') : 'modified';
      const ext = currentFileName && currentFileName.includes('.') ? currentFileName.split('.').pop() : 'txt';
      link.download = `${base}_modified.${ext}`;
      link.click();
      URL.revokeObjectURL(link.href);
    });

    toggleMatchListBtn.addEventListener('click', () => {
      matchListVisible = !matchListVisible;
      matchListContainer.style.display = matchListVisible ? 'block' : 'none';
      if (matchListVisible) updateMatchList(originalContent, findText.value);
    });

    undoBtn.addEventListener('click', undoLast);

    clearHistoryBtn.addEventListener('click', clearHistory);

    // drag & drop
    document.addEventListener('dragover', (e) => e.preventDefault());
    document.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        const file = files[0];
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        loadFile(file);
      }
    });

    // initial
    resetState();
    console.log('🧠 Advanced Regex Studio ready');
  })();
</script>
</body>
</html>
