<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanac — Offline Calendar</title>
<style>
  :root{
    --bg:#0F1115;
    --surface:#15181F;
    --surface-2:#1C2029;
    --surface-3:#232833;
    --border:#282D38;
    --border-soft:#1F232C;
    --text:#ECEAE4;
    --text-dim:#9AA0AC;
    --text-faint:#5C6270;
    --amber:#E8A33D;
    --amber-soft:rgba(232,163,61,.16);
    --blue:#5B8DEF;
    --blue-soft:rgba(91,141,239,.16);
    --green:#4FB286;
    --green-soft:rgba(79,178,134,.16);
    --pink:#E36B8C;
    --pink-soft:rgba(227,107,140,.16);
    --purple:#9B7EDE;
    --purple-soft:rgba(155,126,222,.16);
    --danger:#E5484D;
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:16px;
    --font-display: ui-sans-serif, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-body: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Consolas", monospace;
    --shadow-lg: 0 20px 50px -12px rgba(0,0,0,.55);
    --shadow-md: 0 10px 24px -10px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(232,163,61,.05), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(91,141,239,.05), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--amber-soft);}

  a,button{cursor:pointer;}
  button:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 60px;
  }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:22px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand-mark{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--amber);
    background:var(--amber-soft);
    border:1px solid rgba(232,163,61,.35);
    border-radius:6px;
    padding:3px 6px;
    letter-spacing:.06em;
  }
  .brand h1{
    font-family:var(--font-display);
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }
  .brand span.sub{
    display:block;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:.08em;
    margin-top:2px;
  }

  .search-wrap{
    flex:1;
    max-width:360px;
    position:relative;
  }
  .search-wrap input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:999px;
    padding:10px 16px 10px 36px;
    font-size:13.5px;
  }
  .search-wrap::before{
    content:"⌕";
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-faint);
    font-size:15px;
  }
  .search-wrap input::placeholder{color:var(--text-faint);}

  .btn{
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:10px;
    padding:9px 16px;
    font-size:13.5px;
    font-weight:600;
    transition:background .15s, border-color .15s, transform .1s;
    white-space:nowrap;
  }
  .btn:hover{background:var(--surface-2); border-color:#333947;}
  .btn:active{transform:translateY(1px);}
  .btn-accent{
    background:var(--amber);
    color:#20160a;
    border-color:var(--amber);
  }
  .btn-accent:hover{background:#f0ad4c;}
  .btn-ghost{
    background:transparent;
    border-color:transparent;
    color:var(--text-dim);
  }
  .btn-ghost:hover{background:var(--surface-2); color:var(--text);}
  .btn-danger{
    background:transparent;
    border-color:rgba(229,72,77,.4);
    color:var(--danger);
  }
  .btn-danger:hover{background:rgba(229,72,77,.12);}

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .nav-controls{
    display:flex;
    align-items:center;
    gap:6px;
  }
  .nav-controls button{
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    border-radius:9px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--text);
    font-size:16px;
    line-height:1;
  }
  .nav-controls button:hover{background:var(--surface-2);}
  #todayBtn{width:auto; padding:0 14px; font-size:13px; font-weight:600;}

  .month-label{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:600;
    letter-spacing:.02em;
    margin:0;
    color:var(--text);
  }
  .month-label .yr{color:var(--text-faint); font-weight:400;}

  .view-toggle{
    display:flex;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:3px;
    gap:2px;
  }
  .view-toggle button{
    border:none;
    background:transparent;
    color:var(--text-dim);
    padding:7px 14px;
    border-radius:7px;
    font-size:12.5px;
    font-weight:600;
    letter-spacing:.02em;
  }
  .view-toggle button.active{
    background:var(--surface-3);
    color:var(--text);
  }

  /* ---------- Layout ---------- */
  .layout{
    display:grid;
    grid-template-columns:1fr 220px;
    gap:20px;
    align-items:start;
  }

  /* ---------- Month grid ---------- */
  .month-grid-wrap{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    overflow:hidden;
    box-shadow:var(--shadow-md);
  }
  .weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    border-bottom:1px solid var(--border);
    background:var(--surface-2);
  }
  .weekdays div{
    padding:11px 0;
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.09em;
    color:var(--text-faint);
    font-family:var(--font-mono);
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:minmax(104px,1fr);
  }
  .day-cell{
    border-right:1px solid var(--border-soft);
    border-bottom:1px solid var(--border-soft);
    padding:7px;
    display:flex;
    flex-direction:column;
    gap:5px;
    position:relative;
    transition:background .12s;
    min-width:0;
  }
  .day-cell:hover{background:rgba(255,255,255,.015);}
  .day-cell:nth-child(7n){border-right:none;}
  .day-cell.outside .daynum{color:var(--text-faint); opacity:.5;}
  .day-cell.outside{background:rgba(0,0,0,.12);}

  .daynum-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .daynum{
    font-family:var(--font-mono);
    font-size:12.5px;
    font-weight:600;
    color:var(--text-dim);
    width:22px; height:22px;
    display:flex; align-items:center; justify-content:center;
    border-radius:6px;
  }
  .day-cell.today .daynum{
    background:var(--amber);
    color:#20160a;
  }
  .day-cell.today{
    background:linear-gradient(180deg, rgba(232,163,61,.07), transparent 40%);
  }
  /* dog-ear fold marking today, planner-style */
  .day-cell.today::after{
    content:"";
    position:absolute;
    top:0; right:0;
    width:0; height:0;
    border-style:solid;
    border-width:0 14px 14px 0;
    border-color:transparent var(--amber) transparent transparent;
    opacity:.9;
  }
  .add-day-btn{
    border:none;
    background:transparent;
    color:var(--text-faint);
    font-size:14px;
    width:20px;height:20px;
    border-radius:5px;
    line-height:1;
    opacity:0;
    transition:opacity .12s, background .12s, color .12s;
  }
  .day-cell:hover .add-day-btn{opacity:1;}
  .add-day-btn:hover{background:var(--surface-3); color:var(--text);}

  .chips{
    display:flex;
    flex-direction:column;
    gap:3px;
    overflow:hidden;
    flex:1;
    cursor:pointer;
  }
  .chip{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--c-soft, var(--amber-soft));
    color:var(--text);
    border-left:3px solid var(--c, var(--amber));
    border-radius:5px;
    padding:2.5px 6px;
    font-size:11px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    transition:filter .12s, transform .1s;
  }
  .chip:hover{filter:brightness(1.15);}
  .chip .chip-time{
    font-family:var(--font-mono);
    font-size:9.5px;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .chip.dim{opacity:.25;}
  .more-link{
    font-family:var(--font-mono);
    font-size:10.5px;
    color:var(--text-faint);
    padding:1px 6px;
  }
  .more-link:hover{color:var(--text-dim);}

  /* ---------- Sidebar ---------- */
  .sidebar{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px;
  }
  .panel h3{
    font-family:var(--font-mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-faint);
    margin:0 0 12px;
  }
  .legend-item{
    display:flex;
    align-items:center;
    gap:9px;
    width:100%;
    background:transparent;
    border:none;
    color:var(--text-dim);
    font-size:13px;
    padding:6px 4px;
    border-radius:7px;
    text-align:left;
    transition:background .12s, color .12s;
  }
  .legend-item:hover{background:var(--surface-2); color:var(--text);}
  .legend-item.off{opacity:.4;}
  .legend-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--c);
    flex-shrink:0;
  }

  .mini-stat{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:4px 0;
    font-size:12.5px;
    color:var(--text-dim);
  }
  .mini-stat b{
    font-family:var(--font-mono);
    color:var(--text);
    font-size:15px;
  }

  .upcoming-item{
    padding:9px 0;
    border-top:1px solid var(--border-soft);
    cursor:pointer;
  }
  .upcoming-item:first-child{border-top:none;}
  .upcoming-item .u-date{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--text-faint);
    letter-spacing:.04em;
  }
  .upcoming-item .u-title{
    font-size:13px;
    font-weight:600;
    margin-top:2px;
    color:var(--text);
  }
  .upcoming-item:hover .u-title{color:var(--amber);}
  .empty-note{
    font-size:12.5px;
    color:var(--text-faint);
    line-height:1.5;
    padding:6px 2px;
  }

  /* ---------- Agenda view ---------- */
  .agenda-view{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:8px 0;
    box-shadow:var(--shadow-md);
  }
  .agenda-group{
    padding:14px 22px;
    border-bottom:1px solid var(--border-soft);
  }
  .agenda-group:last-child{border-bottom:none;}
  .agenda-date{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--amber);
    letter-spacing:.06em;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .agenda-date .dow{color:var(--text-faint);}
  .agenda-row{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 10px;
    border-radius:9px;
    transition:background .12s;
  }
  .agenda-row:hover{background:var(--surface-2);}
  .agenda-row .bar{
    width:3px;
    align-self:stretch;
    border-radius:2px;
    background:var(--c, var(--amber));
    flex-shrink:0;
    min-height:34px;
  }
  .agenda-row .time{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--text-dim);
    width:58px;
    flex-shrink:0;
    padding-top:1px;
  }
  .agenda-row .body{flex:1; min-width:0;}
  .agenda-row .title{font-size:14px; font-weight:600;}
  .agenda-row .desc{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:2px;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }
  .agenda-empty{
    padding:60px 20px;
    text-align:center;
    color:var(--text-faint);
    font-size:13.5px;
  }

  /* ---------- Search view ---------- */
  .search-view{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:6px 0;
  }
  .search-hint{
    padding:14px 22px;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-faint);
    letter-spacing:.04em;
    border-bottom:1px solid var(--border-soft);
  }

  .hidden{display:none !important;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(6,7,10,.6);
    backdrop-filter:blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    width:100%;
    max-width:440px;
    box-shadow:var(--shadow-lg);
    max-height:90vh;
    overflow-y:auto;
  }
  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px 0;
  }
  .modal-head h3{
    font-family:var(--font-display);
    font-size:16px;
    margin:0;
  }
  .modal-close{
    background:transparent; border:none;
    color:var(--text-faint);
    font-size:18px;
    width:28px; height:28px;
    border-radius:7px;
  }
  .modal-close:hover{background:var(--surface-3); color:var(--text);}

  .form-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:14px;}
  .field label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--text-faint);
    margin-bottom:6px;
  }
  .field input[type="text"],
  .field input[type="date"],
  .field input[type="time"],
  .field textarea{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    padding:10px 12px;
    color:var(--text);
    font-size:13.5px;
  }
  .field textarea{resize:vertical; min-height:64px; line-height:1.5;}
  .field-row{display:flex; gap:12px;}
  .field-row .field{flex:1; min-width:0;}

  .color-row{display:flex; gap:8px;}
  .color-swatch{
    width:30px; height:30px;
    border-radius:50%;
    border:2px solid transparent;
    background:var(--c);
    position:relative;
    transition:transform .1s;
  }
  .color-swatch:hover{transform:scale(1.08);}
  .color-swatch.selected{border-color:var(--text);}
  .color-swatch.selected::after{
    content:"✓";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    font-size:13px;
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }

  .modal-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:4px;
  }
  .modal-actions .right{display:flex; gap:8px;}

  #dayModal .modal{max-width:400px;}
  .day-modal-header{
    padding:18px 20px 4px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .day-modal-header h3{
    font-family:var(--font-mono);
    font-size:15px;
    margin:0;
    color:var(--text);
  }
  .day-modal-list{padding:8px 12px; display:flex; flex-direction:column; gap:4px;}
  .day-event-row{
    display:flex; align-items:center; gap:10px;
    padding:9px 10px;
    border-radius:9px;
    transition:background .12s;
  }
  .day-event-row:hover{background:var(--surface-3);}
  .day-event-row .dot{width:8px;height:8px;border-radius:50%;background:var(--c); flex-shrink:0;}
  .day-event-row .info{flex:1; min-width:0; cursor:pointer;}
  .day-event-row .info .t{font-size:13.5px; font-weight:600;}
  .day-event-row .info .m{font-family:var(--font-mono); font-size:10.5px; color:var(--text-faint);}
  .day-event-row .del{
    background:transparent; border:none; color:var(--text-faint);
    width:26px;height:26px; border-radius:6px; font-size:14px;
  }
  .day-event-row .del:hover{background:rgba(229,72,77,.15); color:var(--danger);}
  .day-modal-add{
    margin:10px 16px 18px;
    width:calc(100% - 32px);
    text-align:center;
    padding:10px;
  }
  .day-modal-empty{
    padding:26px 20px 10px;
    text-align:center;
    color:var(--text-faint);
    font-size:12.5px;
  }

  /* toast */
  #toast{
    position:fixed;
    bottom:24px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--surface-3);
    border:1px solid var(--border);
    color:var(--text);
    padding:10px 18px;
    border-radius:10px;
    font-size:13px;
    box-shadow:var(--shadow-md);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:200;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    .sidebar{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    .sidebar .panel:first-child{grid-column:1 / -1;}
  }
  @media (max-width:640px){
    .app{padding:16px 12px 40px;}
    .topbar{flex-wrap:wrap;}
    .search-wrap{order:3; max-width:none; flex:1 1 100%;}
    .brand h1{font-size:19px;}
    .month-grid{grid-auto-rows:minmax(64px,1fr);}
    .day-cell{padding:4px;}
    .chip{font-size:9.5px; padding:2px 4px;}
    .chip .chip-time{display:none;}
    .weekdays div{font-size:9.5px;}
    .sidebar{grid-template-columns:1fr;}
    .month-label{font-size:16px;}
  }
</style>
</head>
<body>

<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">▤</span>
      <div>
        <h1>Almanac</h1>
        <span class="sub">LOCAL &amp; OFFLINE</span>
      </div>
    </div>
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="Search events…" autocomplete="off">
    </div>
    <button class="btn btn-accent" id="newEventBtn">+ New event</button>
  </header>

  <nav class="toolbar">
    <div class="nav-controls">
      <button id="prevBtn" aria-label="Previous month">‹</button>
      <button id="todayBtn">Today</button>
      <button id="nextBtn" aria-label="Next month">›</button>
    </div>
    <h2 class="month-label" id="monthLabel"></h2>
    <div class="view-toggle" id="viewToggle">
      <button data-view="month" class="active">Month</button>
      <button data-view="agenda">Agenda</button>
    </div>
  </nav>

  <div class="layout">
    <div>
      <section class="month-grid-wrap" id="monthView">
        <div class="weekdays">
          <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
        </div>
        <div class="month-grid" id="monthGrid"></div>
      </section>

      <section class="agenda-view hidden" id="agendaView">
        <div id="agendaList"></div>
      </section>

      <section class="search-view hidden" id="searchView">
        <div class="search-hint" id="searchHint"></div>
        <div id="searchResults"></div>
      </section>
    </div>

    <aside class="sidebar">
      <div class="panel">
        <h3>Categories</h3>
        <div id="legendList"></div>
      </div>
      <div class="panel">
        <h3>Overview</h3>
        <div class="mini-stat"><span>This month</span><b id="statMonth">0</b></div>
        <div class="mini-stat"><span>Upcoming (7d)</span><b id="statWeek">0</b></div>
        <div class="mini-stat"><span>Total events</span><b id="statTotal">0</b></div>
      </div>
      <div class="panel">
        <h3>Next up</h3>
        <div id="upcomingList"></div>
      </div>
    </aside>
  </div>

</div>

<!-- Event form modal -->
<div class="modal-overlay hidden" id="eventModal">
  <div class="modal">
    <div class="modal-head">
      <h3 id="eventModalTitle">New event</h3>
      <button class="modal-close" id="eventModalClose">✕</button>
    </div>
    <form class="form-body" id="eventForm">
      <div class="field">
        <label for="f-title">Title</label>
        <input type="text" id="f-title" required maxlength="120" placeholder="e.g. Design review">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-date">Date</label>
          <input type="date" id="f-date" required>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-start">Start time</label>
          <input type="time" id="f-start">
        </div>
        <div class="field">
          <label for="f-end">End time</label>
          <input type="time" id="f-end">
        </div>
      </div>
      <div class="field">
        <label for="f-desc">Description</label>
        <textarea id="f-desc" maxlength="500" placeholder="Optional notes…"></textarea>
      </div>
      <div class="field">
        <label>Category</label>
        <div class="color-row" id="colorRow"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-danger hidden" id="deleteEventBtn">Delete</button>
        <div class="right">
          <button type="button" class="btn btn-ghost" id="cancelEventBtn">Cancel</button>
          <button type="submit" class="btn btn-accent">Save event</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Day agenda modal -->
<div class="modal-overlay hidden" id="dayModal">
  <div class="modal">
    <div class="day-modal-header">
      <h3 id="dayModalTitle"></h3>
      <button class="modal-close" id="dayModalClose">✕</button>
    </div>
    <div class="day-modal-list" id="dayModalList"></div>
    <button class="btn btn-accent day-modal-add" id="dayModalAdd">+ Add event on this day</button>
  </div>
</div>

<div id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Data layer ---------------- */
  const STORAGE_KEY = "almanac_events_v1";
  const FILTER_KEY = "almanac_filters_v1";

  const CATEGORIES = [
    { id:"amber",  label:"Amber",  var:"--amber",  soft:"--amber-soft"  },
    { id:"blue",   label:"Blue",   var:"--blue",   soft:"--blue-soft"   },
    { id:"green",  label:"Green",  var:"--green",  soft:"--green-soft"  },
    { id:"pink",   label:"Pink",   var:"--pink",   soft:"--pink-soft"   },
    { id:"purple", label:"Purple", var:"--purple", soft:"--purple-soft" },
  ];

  function loadEvents(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveEvents(events){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  }
  function loadFilters(){
    try{
      const raw = localStorage.getItem(FILTER_KEY);
      return raw ? JSON.parse(raw) : CATEGORIES.map(c=>c.id);
    }catch(e){ return CATEGORIES.map(c=>c.id); }
  }
  function saveFilters(f){
    localStorage.setItem(FILTER_KEY, JSON.stringify(f));
  }

  let events = loadEvents();
  let activeFilters = loadFilters();

  function uid(){
    return "e" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  /* ---------------- Date helpers ---------------- */
  const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  function toISODate(d){
    const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }
  function sameDay(a,b){ return toISODate(a) === toISODate(b); }
  function parseISO(s){
    const [y,m,d] = s.split("-").map(Number);
    return new Date(y, m-1, d);
  }
  function formatTime(t){
    if(!t) return "";
    let [h,m] = t.split(":").map(Number);
    const suffix = h>=12 ? "PM":"AM";
    let h12 = h % 12; if(h12===0) h12=12;
    return `${h12}:${String(m).padStart(2,"0")}${suffix}`;
  }

  /* ---------------- State ---------------- */
  let viewDate = new Date(); // month being displayed
  let currentView = "month"; // month | agenda | search
  let editingId = null;
  let selectedColor = "amber";
  let dayModalDate = null;

  /* ---------------- DOM refs ---------------- */
  const monthGrid = document.getElementById("monthGrid");
  const monthLabel = document.getElementById("monthLabel");
  const monthView = document.getElementById("monthView");
  const agendaView = document.getElementById("agendaView");
  const agendaList = document.getElementById("agendaList");
  const searchView = document.getElementById("searchView");
  const searchResults = document.getElementById("searchResults");
  const searchHint = document.getElementById("searchHint");
  const searchInput = document.getElementById("searchInput");
  const legendList = document.getElementById("legendList");
  const upcomingList = document.getElementById("upcomingList");
  const statMonth = document.getElementById("statMonth");
  const statWeek = document.getElementById("statWeek");
  const statTotal = document.getElementById("statTotal");

  const eventModal = document.getElementById("eventModal");
  const eventForm = document.getElementById("eventForm");
  const eventModalTitle = document.getElementById("eventModalTitle");
  const fTitle = document.getElementById("f-title");
  const fDate = document.getElementById("f-date");
  const fStart = document.getElementById("f-start");
  const fEnd = document.getElementById("f-end");
  const fDesc = document.getElementById("f-desc");
  const colorRow = document.getElementById("colorRow");
  const deleteEventBtn = document.getElementById("deleteEventBtn");

  const dayModal = document.getElementById("dayModal");
  const dayModalTitle = document.getElementById("dayModalTitle");
  const dayModalList = document.getElementById("dayModalList");
  const dayModalAdd = document.getElementById("dayModalAdd");

  const toast = document.getElementById("toast");

  /* ---------------- Toast ---------------- */
  let toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toast.classList.remove("show"), 2200);
  }

  /* ---------------- Legend / categories ---------------- */
  function renderLegend(){
    legendList.innerHTML = "";
    CATEGORIES.forEach(cat=>{
      const btn = document.createElement("button");
      const isOn = activeFilters.includes(cat.id);
      btn.className = "legend-item" + (isOn ? "" : " off");
      btn.innerHTML = `<span class="legend-dot" style="--c:var(${cat.var})"></span>${cat.label}`;
      btn.addEventListener("click", ()=>{
        if(activeFilters.includes(cat.id)){
          activeFilters = activeFilters.filter(id=>id!==cat.id);
        } else {
          activeFilters.push(cat.id);
        }
        saveFilters(activeFilters);
        renderLegend();
        renderCurrentView();
      });
      legendList.appendChild(btn);
    });
  }

  /* ---------------- Color swatch picker (in form) ---------------- */
  function renderColorRow(){
    colorRow.innerHTML = "";
    CATEGORIES.forEach(cat=>{
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "color-swatch" + (selectedColor===cat.id ? " selected":"");
      sw.style.setProperty("--c", `var(${cat.var})`);
      sw.title = cat.label;
      sw.addEventListener("click", ()=>{
        selectedColor = cat.id;
        renderColorRow();
      });
      colorRow.appendChild(sw);
    });
  }

  function catInfo(id){
    return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0];
  }

  /* ---------------- Month grid rendering ---------------- */
  function eventsForDate(iso){
    return events
      .filter(e=>e.date===iso)
      .sort((a,b)=> (a.start||"99:99").localeCompare(b.start||"99:99"));
  }

  function renderMonth(){
    const year = viewDate.getFullYear();
    const month = viewDate.getMonth();
    monthLabel.innerHTML = `${MONTH_NAMES[month]} <span class="yr">${year}</span>`;

    const firstOfMonth = new Date(year, month, 1);
    const startOffset = firstOfMonth.getDay(); // 0=Sun
    const gridStart = new Date(year, month, 1 - startOffset);

    const today = new Date();
    monthGrid.innerHTML = "";

    for(let i=0;i<42;i++){
      const cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate()+i);
      const iso = toISODate(cellDate);
      const isOutside = cellDate.getMonth() !== month;
      const isToday = sameDay(cellDate, today);

      const cell = document.createElement("div");
      cell.className = "day-cell" + (isOutside ? " outside":"") + (isToday ? " today":"");

      const row = document.createElement("div");
      row.className = "daynum-row";
      row.innerHTML = `<span class="daynum">${cellDate.getDate()}</span>`;
      const addBtn = document.createElement("button");
      addBtn.className = "add-day-btn";
      addBtn.textContent = "+";
      addBtn.title = "Add event";
      addBtn.addEventListener("click", (ev)=>{ ev.stopPropagation(); openEventModal(null, iso); });
      row.appendChild(addBtn);
      cell.appendChild(row);

      const chipsWrap = document.createElement("div");
      chipsWrap.className = "chips";
      const dayEvents = eventsForDate(iso);
      const visible = dayEvents.slice(0,3);
      visible.forEach(ev=>{
        const cat = catInfo(ev.color);
        const chip = document.createElement("div");
        const isDim = !activeFilters.includes(ev.color);
        chip.className = "chip" + (isDim ? " dim":"");
        chip.style.setProperty("--c", `var(${cat.var})`);
        chip.style.setProperty("--c-soft", `var(${cat.soft})`);
        chip.innerHTML = `${ev.start ? `<span class="chip-time">${formatTime(ev.start)}</span>`:""}<span>${escapeHtml(ev.title)}</span>`;
        chip.addEventListener("click", (e)=>{ e.stopPropagation(); openEventModal(ev.id); });
        chipsWrap.appendChild(chip);
      });
      if(dayEvents.length > 3){
        const more = document.createElement("div");
        more.className = "more-link";
        more.textContent = `+${dayEvents.length-3} more`;
        more.addEventListener("click",(e)=>{ e.stopPropagation(); openDayModal(iso); });
        chipsWrap.appendChild(more);
      }
      chipsWrap.addEventListener("click", ()=> openDayModal(iso));
      cell.appendChild(chipsWrap);

      cell.addEventListener("click", ()=> openDayModal(iso));

      monthGrid.appendChild(cell);
    }
  }

  /* ---------------- Agenda view ---------------- */
  function renderAgenda(){
    const visibleEvents = events
      .filter(e=>activeFilters.includes(e.color))
      .sort((a,b)=> (a.date+((a.start)||"00:00")).localeCompare(b.date+((b.start)||"00:00")));

    if(visibleEvents.length === 0){
      agendaList.innerHTML = `<div class="agenda-empty">No events to show. Add your first event to see it here.</div>`;
      return;
    }

    const groups = {};
    visibleEvents.forEach(e=>{
      if(!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });

    agendaList.innerHTML = "";
    Object.keys(groups).sort().forEach(iso=>{
      const d = parseISO(iso);
      const group = document.createElement("div");
      group.className = "agenda-group";
      const dateLabel = document.createElement("div");
      dateLabel.className = "agenda-date";
      dateLabel.innerHTML = `<span class="dow">${DOW_SHORT[d.getDay()]}</span> ${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}, ${d.getFullYear()}`;
      group.appendChild(dateLabel);

      groups[iso].forEach(ev=>{
        const cat = catInfo(ev.color);
        const row = document.createElement("div");
        row.className = "agenda-row";
        row.innerHTML = `
          <div class="bar" style="--c:var(${cat.var})"></div>
          <div class="time">${ev.start ? formatTime(ev.start) : "All day"}</div>
          <div class="body">
            <div class="title">${escapeHtml(ev.title)}</div>
            ${ev.description ? `<div class="desc">${escapeHtml(ev.description)}</div>` : ""}
          </div>
        `;
        row.addEventListener("click", ()=> openEventModal(ev.id));
        group.appendChild(row);
      });
      agendaList.appendChild(group);
    });
  }

  /* ---------------- Search ---------------- */
  function renderSearch(query){
    searchHint.textContent = query ? `Results for "${query}"` : "Type to search titles and descriptions";
    const q = query.trim().toLowerCase();
    if(!q){
      searchResults.innerHTML = "";
      return;
    }
    const matches = events
      .filter(e => e.title.toLowerCase().includes(q) || (e.description||"").toLowerCase().includes(q))
      .sort((a,b)=> (a.date+((a.start)||"00:00")).localeCompare(b.date+((b.start)||"00:00")));

    if(matches.length===0){
      searchResults.innerHTML = `<div class="agenda-empty">No events match "${escapeHtml(query)}".</div>`;
      return;
    }
    searchResults.innerHTML = "";
    matches.forEach(ev=>{
      const cat = catInfo(ev.color);
      const d = parseISO(ev.date);
      const row = document.createElement("div");
      row.className = "agenda-row";
      row.style.padding = "12px 22px";
      row.innerHTML = `
        <div class="bar" style="--c:var(${cat.var})"></div>
        <div class="time">${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}</div>
        <div class="body">
          <div class="title">${escapeHtml(ev.title)}</div>
          ${ev.description ? `<div class="desc">${escapeHtml(ev.description)}</div>` : ""}
        </div>
      `;
      row.addEventListener("click", ()=> openEventModal(ev.id));
      searchResults.appendChild(row);
    });
  }

  /* ---------------- Sidebar: stats + upcoming ---------------- */
  function renderSidebar(){
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const inMonth = events.filter(e=>{
      const d = parseISO(e.date);
      return d.getFullYear()===year && d.getMonth()===month;
    });
    statMonth.textContent = inMonth.length;
    statTotal.textContent = events.length;

    const today = new Date(); today.setHours(0,0,0,0);
    const weekAhead = new Date(today); weekAhead.setDate(today.getDate()+7);
    const upcoming = events
      .filter(e=>{
        const d = parseISO(e.date);
        return d >= today && d <= weekAhead;
      })
      .sort((a,b)=> (a.date+((a.start)||"00:00")).localeCompare(b.date+((b.start)||"00:00")));

    statWeek.textContent = upcoming.length;

    if(upcoming.length===0){
      upcomingList.innerHTML = `<div class="empty-note">Nothing in the next 7 days. Add an event to fill your week.</div>`;
    } else {
      upcomingList.innerHTML = "";
      upcoming.slice(0,6).forEach(ev=>{
        const d = parseISO(ev.date);
        const item = document.createElement("div");
        item.className = "upcoming-item";
        item.innerHTML = `<div class="u-date">${MONTH_NAMES[d.getMonth()].slice(0,3)} ${d.getDate()}${ev.start ? " · "+formatTime(ev.start):""}</div><div class="u-title">${escapeHtml(ev.title)}</div>`;
        item.addEventListener("click", ()=> openEventModal(ev.id));
        upcomingList.appendChild(item);
      });
    }
  }

  /* ---------------- View switching ---------------- */
  function renderCurrentView(){
    renderSidebar();
    renderLegend();
    if(currentView === "month"){
      renderMonth();
    } else if(currentView === "agenda"){
      renderAgenda();
    } else if(currentView === "search"){
      renderSearch(searchInput.value);
    }
  }

  function setView(view){
    currentView = view;
    monthView.classList.toggle("hidden", view!=="month");
    agendaView.classList.toggle("hidden", view!=="agenda");
    searchView.classList.toggle("hidden", view!=="search");
    document.querySelectorAll("#viewToggle button").forEach(b=>{
      b.classList.toggle("active", b.dataset.view===view);
    });
    renderCurrentView();
  }

  /* ---------------- Event modal ---------------- */
  function openEventModal(id, presetDate){
    editingId = id;
    eventForm.reset();
    deleteEventBtn.classList.toggle("hidden", !id);

    if(id){
      const ev = events.find(e=>e.id===id);
      eventModalTitle.textContent = "Edit event";
      fTitle.value = ev.title;
      fDate.value = ev.date;
      fStart.value = ev.start || "";
      fEnd.value = ev.end || "";
      fDesc.value = ev.description || "";
      selectedColor = ev.color;
    } else {
      eventModalTitle.textContent = "New event";
      fDate.value = presetDate || toISODate(new Date());
      selectedColor = "amber";
    }
    renderColorRow();
    dayModal.classList.add("hidden");
    eventModal.classList.remove("hidden");
    setTimeout(()=> fTitle.focus(), 30);
  }
  function closeEventModal(){
    eventModal.classList.add("hidden");
    editingId = null;
  }

  eventForm.addEventListener("submit", (e)=>{
    e.preventDefault();
    const title = fTitle.value.trim();
    if(!title) return;
    if(fStart.value && fEnd.value && fEnd.value < fStart.value){
      showToast("End time is before start time");
      return;
    }
    const data = {
      title,
      date: fDate.value,
      start: fStart.value || "",
      end: fEnd.value || "",
      description: fDesc.value.trim(),
      color: selectedColor,
    };
    if(editingId){
      const idx = events.findIndex(ev=>ev.id===editingId);
      events[idx] = { ...events[idx], ...data };
      showToast("Event updated");
    } else {
      events.push({ id: uid(), ...data });
      showToast("Event added");
    }
    saveEvents(events);
    closeEventModal();
    renderCurrentView();
  });

  deleteEventBtn.addEventListener("click", ()=>{
    if(!editingId) return;
    events = events.filter(e=>e.id!==editingId);
    saveEvents(events);
    showToast("Event deleted");
    closeEventModal();
    renderCurrentView();
  });

  document.getElementById("eventModalClose").addEventListener("click", closeEventModal);
  document.getElementById("cancelEventBtn").addEventListener("click", closeEventModal);
  eventModal.addEventListener("click", (e)=>{ if(e.target===eventModal) closeEventModal(); });

  /* ---------------- Day modal ---------------- */
  function openDayModal(iso){
    dayModalDate = iso;
    const d = parseISO(iso);
    dayModalTitle.textContent = `${DOW_SHORT[d.getDay()]}, ${MONTH_NAMES[d.getMonth()]} ${d.getDate()}`;
    renderDayModalList();
    dayModal.classList.remove("hidden");
  }
  function renderDayModalList(){
    const dayEvents = eventsForDate(dayModalDate);
    if(dayEvents.length===0){
      dayModalList.innerHTML = `<div class="day-modal-empty">No events yet on this day.</div>`;
      return;
    }
    dayModalList.innerHTML = "";
    dayEvents.forEach(ev=>{
      const cat = catInfo(ev.color);
      const row = document.createElement("div");
      row.className = "day-event-row";
      row.innerHTML = `
        <span class="dot" style="--c:var(${cat.var})"></span>
        <div class="info">
          <div class="t">${escapeHtml(ev.title)}</div>
          <div class="m">${ev.start ? formatTime(ev.start)+(ev.end ? " – "+formatTime(ev.end):"") : "All day"}</div>
        </div>
        <button class="del" title="Delete">✕</button>
      `;
      row.querySelector(".info").addEventListener("click", ()=> openEventModal(ev.id));
      row.querySelector(".del").addEventListener("click", (e)=>{
        e.stopPropagation();
        events = events.filter(x=>x.id!==ev.id);
        saveEvents(events);
        showToast("Event deleted");
        renderDayModalList();
        renderCurrentView();
      });
      dayModalList.appendChild(row);
    });
  }
  dayModalAdd.addEventListener("click", ()=> openEventModal(null, dayModalDate));
  document.getElementById("dayModalClose").addEventListener("click", ()=> dayModal.classList.add("hidden"));
  dayModal.addEventListener("click", (e)=>{ if(e.target===dayModal) dayModal.classList.add("hidden"); });

  /* ---------------- Toolbar events ---------------- */
  document.getElementById("prevBtn").addEventListener("click", ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()-1, 1);
    renderCurrentView();
  });
  document.getElementById("nextBtn").addEventListener("click", ()=>{
    viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 1);
    renderCurrentView();
  });
  document.getElementById("todayBtn").addEventListener("click", ()=>{
    viewDate = new Date();
    renderCurrentView();
  });
  document.getElementById("viewToggle").addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-view]");
    if(!btn) return;
    setView(btn.dataset.view);
  });
  document.getElementById("newEventBtn").addEventListener("click", ()=> openEventModal(null));

  searchInput.addEventListener("input", ()=>{
    if(searchInput.value.trim()){
      if(currentView !== "search") setView("search");
      else renderSearch(searchInput.value);
    } else if(currentView === "search"){
      setView("month");
    }
  });

  document.addEventListener("keydown",(e)=>{
    if(e.key === "Escape"){
      if(!eventModal.classList.contains("hidden")) closeEventModal();
      else if(!dayModal.classList.contains("hidden")) dayModal.classList.add("hidden");
    }
  });

  /* ---------------- Utils ---------------- */
  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  /* ---------------- Init ---------------- */
  renderColorRow();
  setView("month");

})();
</script>
</body>
</html>
