<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handwritten Letter Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Satisfy&family=Dancing+Script:wght@400;600;700&family=Kalam:wght@300;400;700&family=Shadows+Into+Light&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #c9b9a8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
            background: #e8ddd0;
            border-radius: 48px 48px 32px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            padding: 30px 30px 40px;
        }

        h1 {
            font-family: 'Caveat', cursive;
            font-weight: 600;
            font-size: 2.6rem;
            color: #3d2a1c;
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 18px 24px;
            background: #d6c8b8;
            padding: 10px 22px;
            border-radius: 60px;
            margin-bottom: 20px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .lang-selector label {
            font-weight: 600;
            color: #3f2e1e;
        }

        .lang-selector select {
            padding: 6px 18px 6px 14px;
            border-radius: 40px;
            border: 1px solid #b8a392;
            background: white;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 6px;
        }

        @media (max-width: 900px) {
            .editor-grid {
                grid-template-columns: 1fr;
                gap: 30px;
            }
        }

        .control-panel {
            background: #f5ede4;
            border-radius: 28px;
            padding: 24px 22px;
            border: 1px solid #d6c5b2;
            box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.05), 0 6px 12px rgba(0, 0, 0, 0.06);
        }

        .control-panel label {
            display: block;
            font-weight: 600;
            color: #3f2e1e;
            margin: 18px 0 6px 0;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .control-panel label:first-of-type {
            margin-top: 0;
        }

        .font-size-row {
            display: flex;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            background: #e5d8ca;
            padding: 8px 16px 12px 16px;
            border-radius: 60px;
            margin-bottom: 8px;
            margin-top: 14px;
        }

        .font-size-row input[type="range"] {
            flex: 1;
            min-width: 140px;
            accent-color: #7b5d42;
        }

        .font-size-row span {
            font-weight: 600;
            color: #2f1f12;
            background: white;
            padding: 0 14px;
            border-radius: 40px;
            line-height: 2;
            font-size: 0.95rem;
            min-width: 60px;
            text-align: center;
        }

        .word-count {
            font-size: 0.75rem;
            color: #6f5842;
            opacity: 0.75;
            text-align: right;
            margin-top: 6px;
        }

        /* --- style panel: font / ink / paper / wax seal --- */
        .style-panel {
            background: #e5d8ca;
            border-radius: 24px;
            padding: 14px 18px 16px;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .style-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .style-row > .inline-label {
            font-weight: 600;
            color: #3f2e1e;
            font-size: 0.85rem;
            text-transform: none;
            letter-spacing: normal;
            margin: 0;
            min-width: 92px;
        }

        .font-select {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #b8a392;
            background: white;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 500;
            color: #2f1f12;
        }

        .ink-swatches {
            display: flex;
            gap: 9px;
        }

        .ink-swatch {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
            transition: 0.15s;
            padding: 0;
        }
        .ink-swatch.active {
            border-color: #7b5d42;
            transform: scale(1.18);
        }

        .paper-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .paper-opt {
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid #b8a392;
            background: white;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 500;
            color: #3f2e1e;
            transition: 0.15s;
        }
        .paper-opt.active {
            background: #7b5d42;
            color: white;
            border-color: #5d4230;
        }

        .wax-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .wax-toggle input {
            width: 18px;
            height: 18px;
            accent-color: #7b5d42;
            cursor: pointer;
        }
        .wax-toggle label {
            margin: 0;
            text-transform: none;
            letter-spacing: normal;
            font-weight: 500;
            font-size: 0.88rem;
            cursor: pointer;
        }

        .textarea-wrapper {
            position: relative;
            margin-top: 4px;
        }

        textarea {
            width: 100%;
            min-height: 360px;
            padding: 18px 20px;
            font-family: 'Caveat', cursive;
            font-size: 1.4rem;
            line-height: 1.7;
            background: #ffffff;
            border: 2px solid #d6c5b2;
            border-radius: 24px;
            resize: vertical;
            color: #1f140c;
            transition: 0.15s;
            box-shadow: inset 0 2px 8px rgba(80, 50, 30, 0.04);
        }

        textarea:focus {
            border-color: #9b7b60;
            outline: none;
            box-shadow: 0 0 0 4px #e8d5c0;
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin: 14px 0 8px 0;
        }

        .draft-status {
            font-size: 0.72rem;
            color: #6f5842;
            opacity: 0;
            transition: opacity 0.4s ease;
            margin-right: auto;
        }
        .draft-status.show {
            opacity: 0.75;
        }

        .btn {
            background: #e8dccf;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            color: #2f1f12;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid #cfbcab;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .btn-primary {
            background: #7b5d42;
            border-color: #5d4230;
            color: white;
            box-shadow: 0 4px 10px rgba(90, 60, 40, 0.2);
        }
        .btn-primary:hover {
            background: #634b35;
            transform: scale(1.01);
        }
        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-secondary {
            background: #d6c8b8;
            border-color: #bbaa96;
        }
        .btn-secondary:hover {
            background: #c9b8a6;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #b8a392;
        }
        .btn-outline:hover {
            background: #ede4d8;
        }

        .btn-pdf {
            background: #b33c3c;
            border-color: #8f2e2e;
            color: white;
        }
        .btn-pdf:hover {
            background: #9a3232;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2d3d2a;
            color: #f0f0e8;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
            z-index: 999;
            font-family: 'Segoe UI', sans-serif;
        }
        .toast.show {
            opacity: 1;
        }

        .preview-panel {
            background: #f5ede4;
            border-radius: 28px;
            padding: 24px 22px;
            border: 1px solid #d6c5b2;
            display: flex;
            flex-direction: column;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-header h2 {
            font-family: 'Caveat', cursive;
            font-weight: 500;
            font-size: 1.8rem;
            color: #3d2a1c;
        }

        .preview-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .paper-container {
            background: #ffffff;
            border-radius: 8px;
            padding: 40px 45px;
            box-shadow: 0 4px 20px rgba(60, 40, 20, 0.12);
            border: 1px solid #e0d5c8;
            flex: 1;
            min-height: 460px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- aged paper texture (applied to preview + pdf export root) --- */
        .paper-container.aged-paper,
        .pdf-export-container.aged-paper {
            background:
                radial-gradient(ellipse at top left, rgba(120, 90, 50, 0.10), transparent 55%),
                radial-gradient(ellipse at bottom right, rgba(120, 90, 50, 0.13), transparent 55%),
                url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='120'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E"),
                #fbf4e8;
        }

        /* --- ruled lines (applied to the text container so spacing scales with font-size via em) --- */
        #letterCard.ruled-lines,
        #pdfLetterBody.ruled-lines {
            background-image: repeating-linear-gradient(to bottom,
                transparent 0,
                transparent calc(1.75em - 1px),
                rgba(110, 90, 70, 0.22) calc(1.75em - 1px),
                rgba(110, 90, 70, 0.22) 1.75em);
            background-position: 0 0.3em;
        }

        #letterCard {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            line-height: 1.7;
            color: var(--ink-color, #1f140c);
            white-space: pre-wrap;
            word-break: break-word;
            flex: 1;
            padding: 4px 2px;
            background: transparent;
            display: flex;
            flex-direction: column;
        }

        #letterCard .signature-line {
            margin-top: auto;
            padding-top: 25px;
            text-align: right;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #letterCard .signature-line .signature-divider {
            width: 60%;
            height: 2px;
            background: linear-gradient(to right, transparent, #8b7355 30%, #8b7355 70%, transparent);
            margin-bottom: 12px;
            opacity: 0.4;
        }

        #letterCard .signature-line .signature-name {
            font-family: 'Satisfy', 'Caveat', cursive;
            font-size: 2.7rem;
            font-weight: 400;
            color: var(--ink-color, #1f140c);
            letter-spacing: 1.5px;
            transform: rotate(-0.5deg);
            padding: 0 8px 2px 0;
            position: relative;
            display: inline-block;
            line-height: 1.2;
        }

        #letterCard .signature-line .signature-name::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 5%;
            width: 90%;
            height: 2px;
            background: rgba(60, 40, 20, 0.12);
            border-radius: 2px;
            transform: rotate(-1deg);
        }

        #letterCard .signature-line .signature-date {
            font-family: 'Caveat', cursive;
            font-size: 1.125rem;
            color: #7a6553;
            margin-top: 2px;
            padding-right: 12px;
            opacity: 0.6;
            letter-spacing: 0.5px;
            font-weight: 300;
        }

        .placeholder-signature {
            opacity: 0.35;
            font-weight: 300;
            font-size: 2rem;
            font-family: 'Satisfy', 'Caveat', cursive;
        }

        /* --- wax seal --- */
        .wax-seal {
            position: absolute;
            bottom: 14px;
            right: 22px;
            width: 64px;
            height: 64px;
            transform: rotate(-6deg);
            filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.25));
            pointer-events: none;
            display: none;
        }
        .wax-seal.show {
            display: block;
        }
        .wax-seal svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .pdf-wax-seal {
            width: 130px;
            height: 130px;
            bottom: 34px;
            right: 40px;
        }

        .signature-area {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            background: #e5d8ca;
            padding: 12px 20px;
            border-radius: 60px;
        }

        .signature-area label {
            font-weight: 600;
            color: #3f2e1e;
            margin-right: 6px;
            font-size: 0.9rem;
        }

        .signature-area input {
            flex: 1;
            min-width: 150px;
            padding: 8px 18px;
            border-radius: 60px;
            border: 1px solid #c6b3a0;
            font-family: 'Satisfy', 'Caveat', cursive;
            font-size: 1.4rem;
            background: white;
            color: #1f140c;
            letter-spacing: 1px;
        }
        .signature-area input:focus {
            outline: 2px solid #9b7b60;
            border-color: transparent;
        }

        .signature-area .hint {
            font-size: 0.75rem;
            color: #6f5842;
            opacity: 0.7;
            font-style: italic;
        }

        .download-note {
            margin-top: 10px;
            font-size: 0.8rem;
            color: #6f5842;
            padding: 4px 16px;
            background: #e5d8ca;
            border-radius: 40px;
            display: inline-block;
        }

        .footer-hint {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        /* PDF export container - clean white paper */
        .pdf-export-container {
            position: absolute;
            left: -9999px;
            top: 0;
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            padding: 20mm 25mm;
            display: flex;
            flex-direction: column;
            font-family: 'Caveat', cursive;
            color: var(--ink-color, #1f140c);
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            box-sizing: border-box;
            box-shadow: none;
            border: none;
        }
        .pdf-export-container .pdf-signature {
            margin-top: auto;
            text-align: right;
            padding-top: 30px;
            border-top: 2px dashed #d0c0b0;
            font-family: 'Satisfy', 'Caveat', cursive;
            color: var(--ink-color, #1f140c);
            letter-spacing: 1.5px;
        }
        .pdf-export-container .pdf-date {
            font-family: 'Caveat', cursive;
            color: #7a6553;
            opacity: 0.6;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .app-container {
                padding: 16px;
            }
            .control-panel,
            .preview-panel {
                padding: 18px;
            }
            .paper-container {
                padding: 24px 18px;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
            #letterCard .signature-line .signature-name {
                font-size: 1.8rem;
            }
            .preview-header {
                flex-direction: column;
                align-items: stretch;
            }
            .preview-actions {
                justify-content: stretch;
            }
            .preview-actions .btn {
                flex: 1;
                justify-content: center;
            }
            .style-row > .inline-label {
                min-width: 100%;
            }
            .wax-seal {
                width: 48px;
                height: 48px;
                bottom: 8px;
                right: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>✍️ <span class="i18n" data-key="appTitle">Letter Studio</span>
            <span style="font-size:1.2rem; font-weight:400; color:#6b4f36;" class="i18n" data-key="appSubtitle">handwritten · live preview</span>
        </h1>

        <div class="top-bar">
            <div class="lang-selector">
                <label for="langSelect" class="i18n" data-key="language">🌐 language</label>
                <select id="langSelect">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="pt">Português</option>
                </select>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap; margin-left:auto;">
                <button class="btn btn-secondary" id="resetLetterBtn"><span class="i18n" data-key="reset">↺ reset</span></button>
            </div>
        </div>

        <div class="editor-grid">
            <div class="control-panel">
                <label for="letterInput" class="i18n" data-key="yourLetter">✎ your letter</label>
                <div class="textarea-wrapper">
                    <textarea id="letterInput" spellcheck="false"></textarea>
                </div>
                <div class="word-count" id="wordCount">0 words · 0 characters</div>

                <div class="font-size-row">
                    <label for="fontSizeSlider" style="margin:0; text-transform:none; font-weight:500;" class="i18n" data-key="size">🔤 size</label>
                    <input type="range" id="fontSizeSlider" min="1.0" max="3.0" step="0.1" value="1.8">
                    <span id="fontSizeLabel">1.8rem</span>
                </div>

                <div class="style-panel">
                    <div class="style-row">
                        <span class="inline-label i18n" data-key="fontStyle">✒️ handwriting style</span>
                        <select id="fontSelect" class="font-select">
                            <option value="caveat">Caveat</option>
                            <option value="satisfy">Satisfy</option>
                            <option value="dancing">Dancing Script</option>
                            <option value="kalam">Kalam</option>
                            <option value="shadows">Shadows Into Light</option>
                        </select>
                    </div>
                    <div class="style-row">
                        <span class="inline-label i18n" data-key="inkColorLabel">🖋️ ink</span>
                        <div class="ink-swatches" id="inkSwatches">
                            <button type="button" class="ink-swatch active" data-ink="charcoal" style="background:#1f140c" title="Charcoal"></button>
                            <button type="button" class="ink-swatch" data-ink="indigo" style="background:#24314f" title="Indigo"></button>
                            <button type="button" class="ink-swatch" data-ink="sepia" style="background:#5b3a22" title="Sepia"></button>
                            <button type="button" class="ink-swatch" data-ink="forest" style="background:#2f3b2a" title="Forest"></button>
                        </div>
                    </div>
                    <div class="style-row">
                        <span class="inline-label i18n" data-key="paperStyleLabel">📜 paper</span>
                        <div class="paper-options" id="paperOptions">
                            <button type="button" class="paper-opt active" data-paper="plain"><span class="i18n" data-key="paperPlain">Plain</span></button>
                            <button type="button" class="paper-opt" data-paper="ruled"><span class="i18n" data-key="paperRuled">Ruled</span></button>
                            <button type="button" class="paper-opt" data-paper="aged"><span class="i18n" data-key="paperAged">Aged</span></button>
                        </div>
                    </div>
                    <div class="style-row">
                        <div class="wax-toggle">
                            <input type="checkbox" id="waxToggle">
                            <label for="waxToggle" class="i18n" data-key="waxSealLabel">🔴 wax seal</label>
                        </div>
                    </div>
                </div>

                <div class="action-row">
                    <span class="draft-status" id="draftStatus"></span>
                    <span style="font-size:0.8rem; color:#6f5842;" class="i18n" data-key="livePreview">⚡ live preview · instant updates</span>
                    <button class="btn btn-outline" id="copyLetterBtn" style="font-size:0.85rem;"><span class="i18n" data-key="copyLetter">📋 copy letter</span></button>
                </div>
            </div>

            <div class="preview-panel">
                <div class="preview-header">
                    <h2 class="i18n" data-key="preview">📄 preview</h2>
                    <div class="preview-actions">
                        <button class="btn btn-outline" id="copyPreviewBtn" style="font-size:0.85rem;"><span class="i18n" data-key="copyPreview">📋 copy preview</span></button>
                        <button class="btn btn-pdf" id="downloadPdfBtn" style="padding: 8px 18px;"><span class="i18n" data-key="pdf">📄 PDF</span></button>
                        <button class="btn btn-primary" id="downloadImgBtn" style="padding: 8px 22px;"><span class="i18n" data-key="image">⬇️ image</span></button>
                    </div>
                </div>

                <div class="paper-container paper-plain" id="paperContainer">
                    <div id="letterCard">
                        <div id="letterBody"></div>
                        <div class="signature-line" id="signatureDisplay">
                            <div class="signature-divider"></div>
                            <span class="signature-name"><span class="placeholder-signature" class="i18n" data-key="placeholderSignature">your signature</span></span>
                            <span class="signature-date" id="signatureDate"></span>
                        </div>
                    </div>
                    <div class="wax-seal" id="waxSeal">
                        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <radialGradient id="waxGrad1" cx="35%" cy="30%" r="75%">
                                    <stop offset="0%" stop-color="#9c3232"/>
                                    <stop offset="55%" stop-color="#7a1f1f"/>
                                    <stop offset="100%" stop-color="#4a1010"/>
                                </radialGradient>
                            </defs>

    <script>
        (function() {
            // --- i18n Dictionary ---

                    paperRuled: 'Ruled',
                    paperAged: 'Aged',
                    waxSealLabel: '🔴 wax seal',
                    wordsLabel: 'words',
                    charsLabel: 'characters',
                    autosaved: '✓ Autosaved',

                    livePreview: '⚡ live preview · instant updates',

                    preview: '📄 preview',

                    paperStyleLabel: '📜 papel',
                    paperPlain: 'Liso',
                    paperRuled: 'Rayado',
                    paperAged: 'Envejecido',
                    waxSealLabel: '🔴 sello de lacre',

                },
                pt: {
                    appTitle: 'Estúdio de Cartas',
                    appSubtitle: 'manuscrito · visualização ao vivo',
                    language: '🌐 idioma',
                    reset: '↺ reiniciar',
                    yourLetter: '✎ sua carta',
                    size: '🔤 tamanho',
                    fontStyle: '✒️ estilo de letra',
                    inkColorLabel: '🖋️ tinta',
                    paperStyleLabel: '📜 papel',
                    paperPlain: 'Liso',
                    paperRuled: 'Pautado',
                    paperAged: 'Envelhecido',
                    waxSealLabel: '🔴 selo de lacre',
                    wordsLabel: 'palavras',
                    charsLabel: 'caracteres',
                    autosaved: '✓ Salvo automaticamente',
                    draftRestored: '📝 Rascunho restaurado',
                    livePreview: '⚡ visualização ao vivo · atualizações instantâneas',
                    copyLetter: '📋 copiar carta',
                    preview: '📄 visualização',
                    copyPreview: '📋 copiar visualização',
                    pdf: '📄 PDF',
                    image: '⬇️ imagem',
                    signature: '🖊️ assinatura',
                    signatureHint: '(estilo cursivo · atualização automática)',
                    imageNote: '⬇️ imagem e PDF combinam com seu estilo',
                    placeholderSignature: 'sua assinatura',
                    copiedLetter: '📋 Carta copiada para a área de transferência',
                    copiedPreview: '📋 Visualização copiada para a área de transferência',
                    copied: '✓ Copiado para a área de transferência',
                    dateFormat: { year: 'numeric', month: 'long', day: 'numeric' },
                    defaultLetter: `Querida amiga,

Espero que esta carta te encontre bem. As folhas de outono estão caindo e não pude deixar de pensar nos momentos em que passeamos pelo velho parque.

A vida tem sido tranquila ultimamente, e encontro alegria em coisas simples — uma xícara de chá quente, o som da chuva e o riso das crianças.

Aguardo sua resposta.

Com todo meu carinho,`
                }
            };

            // --- font family + ink color lookup tables ---
            const fontFamilyMap = {
                caveat: "'Caveat', cursive",
                satisfy: "'Satisfy', cursive",
                dancing: "'Dancing Script', cursive",
                kalam: "'Kalam', cursive",
                shadows: "'Shadows Into Light', cursive"
            };
            const inkColorMap = {
                charcoal: '#1f140c',
                indigo: '#24314f',
                sepia: '#5b3a22',
                forest: '#2f3b2a'
            };
            const DRAFT_KEY = 'letterStudioDraft_v1';

            // --- DOM refs ---
            const letterInput = document.getElementById('letterInput');
            const fontSizeSlider = document.getElementById('fontSizeSlider');
            const fontSizeLabel = document.getElementById('fontSizeLabel');
            const wordCountEl = document.getElementById('wordCount');
            const letterBody = document.getElementById('letterBody');
            const letterCard = document.getElementById('letterCard');
            const signatureDisplay = document.getElementById('signatureDisplay');
            const signatureName = signatureDisplay.querySelector('.signature-name');
            const signatureDate = document.getElementById('signatureDate');
            const signatureInput = document.getElementById('signatureInput');
            const resetBtn = document.getElementById('resetLetterBtn');
            const downloadBtn = document.getElementById('downloadImgBtn');
            const downloadPdfBtn = document.getElementById('downloadPdfBtn');
            const paperContainer = document.getElementById('paperContainer');
            const langSelect = document.getElementById('langSelect');
            const copyLetterBtn = document.getElementById('copyLetterBtn');
            const copyPreviewBtn = document.getElementById('copyPreviewBtn');
            const toast = document.getElementById('toast');
            const draftStatus = document.getElementById('draftStatus');

            const fontSelect = document.getElementById('fontSelect');
            const inkSwatches = document.getElementById('inkSwatches');
            const paperOptions = document.getElementById('paperOptions');
            const waxToggle = document.getElementById('waxToggle');
            const waxSeal = document.getElementById('waxSeal');
            const waxSealLetter = document.getElementById('waxSealLetter');

            // PDF export container
            const pdfContainer = document.getElementById('pdfExportContainer');
            const pdfLetterBody = document.getElementById('pdfLetterBody');
            const pdfSignature = document.getElementById('pdfSignature');
            const pdfDate = document.getElementById('pdfDate');
            const pdfWaxSeal = document.getElementById('pdfWaxSeal');
            const pdfWaxSealLetter = document.getElementById('pdfWaxSealLetter');

            // --- current style state ---
            let currentFont = 'caveat';
            let currentInk = 'charcoal';
            let currentPaper = 'plain';
            let waxSealOn = false;
            let draftSaveTimer = null;
            let draftStatusTimer = null;

            // --- i18n update function ---
            function updateI18n(lang) {
                const strings = i18n[lang] || i18n.en;
                document.querySelectorAll('.i18n').forEach(el => {
                    const key = el.dataset.key;
                    if (key && strings[key] !== undefined) {
                        // Preserve emojis and HTML
                        el.innerHTML = strings[key];
                    }
                });
                // Update placeholder in signature input
                const placeholders = {
                    en: 'e.g. Elena',
                    es: 'p.ej. Elena',
                    pt: 'ex. Elena'
                };
                signatureInput.placeholder = placeholders[lang] || 'e.g. Elena';
            }

            function getLang() {
                return langSelect.value;
            }

            function getDateFormat() {
                const lang = getLang();
                return i18n[lang]?.dateFormat || { year: 'numeric', month: 'long', day: 'numeric' };
            }

            function getDefaultLetter() {
                const lang = getLang();
                return i18n[lang]?.defaultLetter || i18n.en.defaultLetter;
            }

            function getCurrentFontSize() {
                return parseFloat(fontSizeSlider.value);
            }

            // --- update preview ---
            function getCleanLetterText() {
                return letterInput.value;
            }

            function updateLetterPreview() {
                const cleanText = getCleanLetterText();
                letterBody.innerText = cleanText;
            }

            function updateSignatureDisplay() {
                const sig = signatureInput.value.trim() || 'your signature';
                const placeholder = signatureName.querySelector('.placeholder-signature');
                if (placeholder) {
                    signatureName.innerHTML = sig;
                } else {
                    signatureName.innerText = sig;
                }
                const now = new Date();
                const lang = getLang();
                const options = getDateFormat();
                try {
                    const dateStr = now.toLocaleDateString(lang, options);
                    signatureDate.innerText = dateStr;
                    pdfDate.innerText = dateStr;
                } catch (e) {
                    const dateStr = now.toLocaleDateString('en-US', options);
                    signatureDate.innerText = dateStr;
                    pdfDate.innerText = dateStr;
                }
                pdfSignature.innerText = sig;
                updateWaxLetter();
            }

            function applyFontSize() {
                const val = parseFloat(fontSizeSlider.value);
                fontSizeLabel.textContent = val.toFixed(1) + 'rem';

                // Apply to preview card
                letterCard.style.fontSize = val.toFixed(1) + 'rem';

                // Scale signature proportionally
                const sigScale = val / 1.8;
                signatureName.style.fontSize = (2.7 * sigScale) + 'rem';
                signatureDate.style.fontSize = (1.125 * sigScale) + 'rem';

                // Update PDF container font size
                pdfLetterBody.style.fontSize = val.toFixed(1) + 'rem';
                pdfLetterBody.style.lineHeight = (val * 1.1) + 'rem';
                pdfSignature.style.fontSize = (2.7 * sigScale) + 'rem';
                pdfDate.style.fontSize = (1.125 * sigScale) + 'rem';
            }

            // --- style controls: font family, ink, paper, wax seal ---
            function applyFontFamily() {
                const ff = fontFamilyMap[currentFont] || fontFamilyMap.caveat;
                letterCard.style.fontFamily = ff;
                letterInput.style.fontFamily = ff;
                pdfLetterBody.style.fontFamily = ff;
            }

            function applyInk() {
                const hex = inkColorMap[currentInk] || inkColorMap.charcoal;
                paperContainer.style.setProperty('--ink-color', hex);
                pdfContainer.style.setProperty('--ink-color', hex);
            }

            function setActiveInkSwatch(ink) {
                inkSwatches.querySelectorAll('.ink-swatch').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.ink === ink);
                });
            }

            function applyPaper(style) {
                paperContainer.classList.remove('paper-plain', 'aged-paper');
                pdfContainer.classList.remove('paper-plain', 'aged-paper');
                letterCard.classList.remove('ruled-lines');
                pdfLetterBody.classList.remove('ruled-lines');

                if (style === 'aged') {
                    paperContainer.classList.add('aged-paper');
                    pdfContainer.classList.add('aged-paper');
                } else if (style === 'ruled') {
                    paperContainer.classList.add('paper-plain');
                    pdfContainer.classList.add('paper-plain');
                    letterCard.classList.add('ruled-lines');
                    pdfLetterBody.classList.add('ruled-lines');
                } else {
                    paperContainer.classList.add('paper-plain');
                    pdfContainer.classList.add('paper-plain');
                }
            }

            function setActivePaperOption(style) {
                paperOptions.querySelectorAll('.paper-opt').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.paper === style);
                });
            }

            function updateWaxLetter() {
                const sig = signatureInput.value.trim();
                const initial = (sig.charAt(0) || 'E').toUpperCase();
                waxSealLetter.textContent = initial;
                pdfWaxSealLetter.textContent = initial;
            }

            function applyWax() {
                waxSeal.classList.toggle('show', waxSealOn);
                pdfWaxSeal.classList.toggle('show', waxSealOn);
                updateWaxLetter();
            }

            function updateWordCount() {
                const raw = letterInput.value;
                const trimmed = raw.trim();
                const words = trimmed.length ? trimmed.split(/\s+/).length : 0;
                const chars = raw.length;
                const lang = getLang();
                const wLabel = i18n[lang]?.wordsLabel || 'words';
                const cLabel = i18n[lang]?.charsLabel || 'characters';
                wordCountEl.textContent = `${words} ${wLabel} · ${chars} ${cLabel}`;
            }

            function updateAll() {
                updateLetterPreview();
                updateSignatureDisplay();
                applyFontSize();
                updateWordCount();
                pdfLetterBody.innerText = getCleanLetterText();
            }

            // --- autosave draft ---
            function scheduleDraftSave() {
                clearTimeout(draftSaveTimer);
                draftSaveTimer = setTimeout(saveDraft, 500);
            }

            function saveDraft() {
                try {
                    const draft = {
                        letter: letterInput.value,
                        signature: signatureInput.value,
                        fontSize: fontSizeSlider.value,
                        fontFamily: currentFont,
                        ink: currentInk,
                        paper: currentPaper,
                        wax: waxSealOn,
                        lang: getLang()
                    };
                    localStorage.setItem(DRAFT_KEY, JSON.stringify(draft));
                    showDraftStatus();
                } catch (e) {
                    // localStorage unavailable (private mode, quota, etc.) — fail silently
                }
            }

            function showDraftStatus() {
                const lang = getLang();
                draftStatus.textContent = i18n[lang]?.autosaved || 'Autosaved';
                draftStatus.classList.add('show');
                clearTimeout(draftStatusTimer);
                draftStatusTimer = setTimeout(() => draftStatus.classList.remove('show'), 1500);
            }

            function loadDraft() {
                try {
                    const raw = localStorage.getItem(DRAFT_KEY);
                    if (!raw) return false;
                    const draft = JSON.parse(raw);
                    if (draft.lang) langSelect.value = draft.lang;
                    letterInput.value = draft.letter ?? getDefaultLetter();
                    signatureInput.value = draft.signature ?? 'Elena';
                    fontSizeSlider.value = draft.fontSize ?? '1.8';
                    currentFont = draft.fontFamily || 'caveat';
                    currentInk = draft.ink || 'charcoal';
                    currentPaper = draft.paper || 'plain';
                    waxSealOn = !!draft.wax;
                    return true;
                } catch (e) {
                    return false;
                }
            }

            // --- reset ---
            function resetAll() {
                const lang = getLang();
                letterInput.value = getDefaultLetter();
                signatureInput.value = 'Elena';
                fontSizeSlider.value = '1.8';
                currentFont = 'caveat';
                currentInk = 'charcoal';
                currentPaper = 'plain';
                waxSealOn = false;

                fontSelect.value = currentFont;
                setActiveInkSwatch(currentInk);
                setActivePaperOption(currentPaper);
                waxToggle.checked = false;

                applyFontFamily();
                applyInk();
                applyPaper(currentPaper);
                applyWax();
                updateAll();
                fontSizeLabel.textContent = '1.8rem';

                try {
                    localStorage.removeItem(DRAFT_KEY);
                } catch (e) { /* ignore */ }
            }

            // --- download image (PNG) - respects font size ---
            function downloadLetterImage() {
                const raw = letterInput.value;
                letterInput.value = raw;

                const fontSize = getCurrentFontSize();
                const sigScale = fontSize / 1.8;
                letterCard.style.fontSize = fontSize + 'rem';
                signatureName.style.fontSize = (2.7 * sigScale) + 'rem';
                signatureDate.style.fontSize = (1.125 * sigScale) + 'rem';
                updateLetterPreview();
                updateSignatureDisplay();

                // Force reflow
                void paperContainer.offsetHeight;

                setTimeout(() => {
                    html2canvas(paperContainer, {
                        scale: 2.5,
                        backgroundColor: '#ffffff',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        width: paperContainer.scrollWidth,
                        height: paperContainer.scrollHeight,
                    }).then((canvas) => {
                        const link = document.createElement('a');
                        link.download = 'handwritten-letter.png';
                        link.href = canvas.toDataURL('image/png');
                        link.click();
                    }).catch(err => {
                        alert('Could not generate image. Please try again.\n' + err);
                    });
                }, 100);
            }

            // --- download PDF - respects font size ---
            function downloadPDF() {
                const fontSize = getCurrentFontSize();
                const sigScale = fontSize / 1.8;

                // Get clean text and signature
                const cleanText = getCleanLetterText();
                const sig = signatureInput.value.trim() || 'your signature';

                // Update PDF container with current content and font size
                pdfLetterBody.innerText = cleanText;
                pdfLetterBody.style.fontSize = fontSize + 'rem';
                pdfLetterBody.style.lineHeight = (fontSize * 1.1) + 'rem';

                pdfSignature.innerText = sig;
                pdfSignature.style.fontSize = (2.7 * sigScale) + 'rem';
                pdfSignature.style.fontFamily = 'Satisfy, Caveat, cursive';

                const now = new Date();
                const lang = getLang();
                const options = getDateFormat();
                try {
                    pdfDate.innerText = now.toLocaleDateString(lang, options);
                } catch (e) {
                    pdfDate.innerText = now.toLocaleDateString('en-US', options);
                }
                pdfDate.style.fontSize = (1.125 * sigScale) + 'rem';
                pdfDate.style.color = '#7a6553';
                pdfDate.style.fontFamily = 'Caveat, cursive';
                pdfDate.style.opacity = '0.6';

                // Force reflow to ensure styles are applied
                void pdfContainer.offsetHeight;

                setTimeout(() => {
                    html2canvas(pdfContainer, {
                        scale: 3.0,
                        backgroundColor: '#ffffff',
                        allowTaint: false,
                        useCORS: true,
                        logging: false,
                        width: pdfContainer.scrollWidth,
                        height: pdfContainer.scrollHeight,
                        onclone: function(document) {
                            const clone = document.getElementById('pdfExportContainer');
                            if (clone) {
                                const cloneBody = clone.querySelector('#pdfLetterBody');
                                if (cloneBody) {
                                    cloneBody.style.fontSize = fontSize + 'rem';
                                    cloneBody.style.lineHeight = (fontSize * 1.1) + 'rem';
                                }
                            }
                        }
                    }).then((canvas) => {
                        const imgData = canvas.toDataURL('image/png');
                        const { jsPDF } = window.jspdf;

                        const pdfWidth = 210;
                        const pdfHeight = 297;

                        const pdf = new jsPDF({
                            orientation: 'portrait',
                            unit: 'mm',
                            format: 'a4'
                        });

                        const imgAspect = canvas.width / canvas.height;
                        const pageAspect = pdfWidth / pdfHeight;

                        let imgWidthMM, imgHeightMM;
                        if (imgAspect > pageAspect) {
                            imgWidthMM = pdfWidth - 20;
                            imgHeightMM = imgWidthMM / imgAspect;
                        } else {
                            imgHeightMM = pdfHeight - 20;
                            imgWidthMM = imgHeightMM * imgAspect;
                        }

                        const xOffset = (pdfWidth - imgWidthMM) / 2;
                        const yOffset = (pdfHeight - imgHeightMM) / 2;

                        pdf.addImage(imgData, 'PNG', xOffset, yOffset, imgWidthMM, imgHeightMM);
                        pdf.save('handwritten-letter.pdf');
                    }).catch(err => {
                        console.error('PDF generation error:', err);
                        alert('Could not generate PDF. Please try again.\n' + err);
                    });
                }, 400);
            }

            // --- Copy to clipboard ---
            function copyLetterToClipboard() {
                const text = letterInput.value;
                const lang = getLang();
                const msg = i18n[lang]?.copiedLetter || '📋 Letter copied to clipboard';
                navigator.clipboard.writeText(text).then(() => {
                    showToast(msg);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(msg);
                });
            }

            function copyPreviewToClipboard() {
                const letterText = letterBody.innerText;
                let sig = signatureInput.value.trim() || 'your signature';
                const dateStr = signatureDate.innerText;
                const fullText = `${letterText}\n\n— ${sig}\n${dateStr}`;
                const lang = getLang();
                const msg = i18n[lang]?.copiedPreview || '📋 Preview copied to clipboard';

                navigator.clipboard.writeText(fullText).then(() => {
                    showToast(msg);
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = fullText;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast(msg);
                });
            }

            // --- Toast helper ---
            let toastTimer = null;

            function showToast(message) {
                toast.textContent = message;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // --- event binding ---
            letterInput.addEventListener('input', function() {
                updateAll();
                scheduleDraftSave();
            });
            signatureInput.addEventListener('input', function() {
                updateAll();
                scheduleDraftSave();
            });
            fontSizeSlider.addEventListener('input', function() {
                applyFontSize();
                scheduleDraftSave();
            });

            fontSelect.addEventListener('change', function() {
                currentFont = fontSelect.value;
                applyFontFamily();
                scheduleDraftSave();
            });

            inkSwatches.querySelectorAll('.ink-swatch').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentInk = btn.dataset.ink;
                    applyInk();
                    setActiveInkSwatch(currentInk);
                    scheduleDraftSave();
                });
            });

            paperOptions.querySelectorAll('.paper-opt').forEach(btn => {
                btn.addEventListener('click', function() {
                    currentPaper = btn.dataset.paper;
                    applyPaper(currentPaper);
                    setActivePaperOption(currentPaper);
                    scheduleDraftSave();
                });
            });

            waxToggle.addEventListener('change', function() {
                waxSealOn = waxToggle.checked;
                applyWax();
                scheduleDraftSave();
            });

            langSelect.addEventListener('change', function() {
                const lang = getLang();
                updateI18n(lang);
                // Reset the letter to default for the selected language
                letterInput.value = getDefaultLetter();
                signatureInput.value = 'Elena';
                fontSizeSlider.value = '1.8';
                updateAll();
                fontSizeLabel.textContent = '1.8rem';
                scheduleDraftSave();
            });

            resetBtn.addEventListener('click', resetAll);
            downloadBtn.addEventListener('click', downloadLetterImage);
            downloadPdfBtn.addEventListener('click', downloadPDF);
            copyLetterBtn.addEventListener('click', copyLetterToClipboard);
            copyPreviewBtn.addEventListener('click', copyPreviewToClipboard);

            // --- init ---
            (function init() {
                const restored = loadDraft();
                if (!restored) {
                    letterInput.value = getDefaultLetter();
                    signatureInput.value = 'Elena';
                    currentFont = 'caveat';
                    currentInk = 'charcoal';
                    currentPaper = 'plain';
                    waxSealOn = false;
                }

                updateI18n(getLang());
                fontSelect.value = currentFont;
                setActiveInkSwatch(currentInk);
                setActivePaperOption(currentPaper);
                waxToggle.checked = waxSealOn;

                applyFontFamily();
                applyInk();
                applyPaper(currentPaper);
                applyWax();
                updateAll();
                fontSizeLabel.textContent = parseFloat(fontSizeSlider.value).toFixed(1) + 'rem';

                if (restored) {
                    showToast(i18n[getLang()]?.draftRestored || '📝 Draft restored');
                }
            })();

        })();
    </script>
</body>
</html>
